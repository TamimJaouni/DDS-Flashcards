<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#315efb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DDS Cards">
<title>DDS Flashcards</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #16181d;
  --muted: #6c727f;
  --border: rgba(22,24,29,.10);
  --accent: #315efb;
  --danger: #d9363e;
  --ok: #238636;
  --soft: #eef1f6;
  --shadow: 0 12px 34px rgba(20,24,31,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0e1014; --card:#171a20; --text:#f4f6f8; --muted:#9da5b4;
    --border:rgba(255,255,255,.10); --accent:#6f8cff; --danger:#ff6b72;
    --ok:#53c66b; --soft:#21252d; --shadow:none;
  }
}
* { box-sizing:border-box; }
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; }
button { font:inherit; }
.app { max-width:760px; margin:0 auto; min-height:100vh; padding:18px 16px 40px; }
.topbar { display:flex; align-items:center; gap:12px; min-height:48px; margin-bottom:14px; }
.back { border:0; background:var(--soft); color:var(--text); width:42px; height:42px; border-radius:13px; font-size:24px; cursor:pointer; }
.top-title { font-size:18px; font-weight:700; line-height:1.2; }
.hero { padding:18px 2px 8px; }
.hero h1 { margin:0 0 6px; font-size:32px; letter-spacing:-.8px; }
.hero p { margin:0; color:var(--muted); line-height:1.45; }
.deck-list { display:grid; gap:11px; margin-top:18px; }
.deck { width:100%; text-align:left; border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:18px; padding:17px 18px; box-shadow:var(--shadow); cursor:pointer; }
.deck:active { transform:scale(.995); }
.deck-row { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
.deck-title { font-size:17px; font-weight:700; line-height:1.32; }
.chev { color:var(--muted); font-size:22px; }
.meta { margin-top:9px; display:flex; gap:9px; flex-wrap:wrap; color:var(--muted); font-size:13px; }
.pill { background:var(--soft); border-radius:999px; padding:5px 8px; }
.lecture-card { border:1px solid var(--border); background:var(--card); border-radius:20px; padding:20px; box-shadow:var(--shadow); }
.lecture-card h2 { margin:0 0 8px; font-size:22px; line-height:1.25; }
.lecture-card p { color:var(--muted); margin:0; }
.actions { display:grid; gap:10px; margin-top:18px; }
.btn { width:100%; min-height:52px; border-radius:15px; border:1px solid var(--border); padding:0 16px; font-weight:700; cursor:pointer; background:var(--card); color:var(--text); }
.btn.primary { background:var(--accent); color:white; border-color:transparent; }
.btn.danger { color:var(--danger); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.progressline { margin-top:15px; height:8px; background:var(--soft); border-radius:99px; overflow:hidden; }
.progressline > div { height:100%; background:var(--accent); width:0; transition:width .2s ease; }
.flash-wrap { display:flex; flex-direction:column; min-height:calc(100vh - 115px); }
.flash-meta { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:13px; margin:2px 2px 12px; }
.flashcard { flex:1; min-height:360px; background:var(--card); border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow); padding:24px 21px; display:flex; flex-direction:column; }
.side-label { color:var(--muted); text-transform:uppercase; letter-spacing:.12em; font-size:11px; font-weight:800; margin-bottom:16px; }
.question { font-size:23px; font-weight:750; line-height:1.42; letter-spacing:-.25px; white-space:pre-wrap; }
.answer { margin-top:21px; padding-top:20px; border-top:1px solid var(--border); font-size:17px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
.answer.hidden { display:none; }
.review-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
.review-actions.hidden { display:none; }
.correct { background:color-mix(in srgb, var(--ok) 13%, var(--card)); color:var(--ok); }
.wrong { background:color-mix(in srgb, var(--danger) 12%, var(--card)); color:var(--danger); }
.footer-actions { margin-top:10px; display:flex; gap:10px; }
.footer-actions .btn { min-height:46px; font-weight:650; }
.empty { text-align:center; padding:42px 18px; color:var(--muted); }
.done { text-align:center; padding:45px 20px; }
.done h2 { margin:0 0 8px; font-size:28px; }
.small { font-size:13px; color:var(--muted); }
@media (max-width:520px){
  .app{padding:12px 12px 28px}.hero h1{font-size:29px}.question{font-size:21px}.answer{font-size:16px}.flashcard{padding:21px 18px;min-height:335px}
}
</style>
</head>
<body>
<main class="app"><div id="root"></div></main>
<script>
const DECKS = [{"title": "Lecture Finite State Machines (FSMs)", "cards": [{"number": 1, "question": "What is a finite-state machine (FSM)?", "answer": "A finite-state machine (FSM) is a sequential digital circuit used to control digital systems.\nUnlike combinational circuits, its outputs depend not only on the current inputs but also on\nthe previous history of inputs, because it contains memory elements that store the current\nstate. The next state is determined by the current state together with the input signals.\nSince an FSM has only a finite number of possible states, it is called a finite-state machine.\nIf there are n memory elements, theoretically up to 2𝑛 states can be represented."}, {"number": 2, "question": "Why do state machines require memory?", "answer": "Memory is required because state machines must remember previous events. The outputs\noften depend not only on current inputs but also on what happened before. This is achieved\nby storing the current state in memory elements such as flip-flops. Without memory, the\ncircuit would behave like a combinational circuit, where outputs depend only on the\ncurrent inputs and not on past events. The stored state allows the FSM to make decisions\nbased on its history."}, {"number": 3, "question": "What is the difference between Moore and Mealy state machines?", "answer": "The main difference is how outputs are generated.\n• In a Moore machine, outputs depend only on the current state.\n• In a Mealy machine, outputs depend on both the current state and the input\nsignals.\nMoore machines are usually easier to design and understand because outputs change only\nafter a state transition. Mealy machines often require fewer states, making them more\n\ncompact, but their outputs are generated by combinational logic and may change\nimmediately when inputs change."}, {"number": 4, "question": "What is the difference between synchronous and asynchronous state machines?", "answer": "A synchronous state machine changes state only at clock edges. It uses flip-flops as\nmemory elements, ensuring that all state changes occur simultaneously. This makes the\ndesign predictable and easier to verify.\nAn asynchronous state machine changes state immediately when inputs change. It uses\nlatches instead of flip-flops and is generally more difficult to design because timing\nproblems and race conditions can occur.\nThis lecture focuses only on synchronous state machines."}, {"number": 5, "question": "What is a state diagram and why is it useful?", "answer": "A state diagram is a graphical representation of an FSM. Each circle represents a state,\nwhile arrows show possible transitions between states. Labels on the arrows specify the\nconditions that cause the transition.\nA state diagram has a similar role to a truth table in combinational logic—it describes the\ncomplete behavior of the FSM. It helps designers visualize the operation before\nimplementing it in hardware description languages such as Verilog or VHDL."}, {"number": 6, "question": "Explain how the timer state machine works.", "answer": "The timer FSM has four states:\n• IDLE – waits for the Start signal.\n• RESETCNT – resets the counter.\n\n• COUNT – enables the counter to count time.\n• STOP – activates the speaker.\nThe transition sequence is:\n• IDLE → RESETCNT when Start = 1\n• RESETCNT → COUNT automatically\n• COUNT → STOP when the comparator indicates that the desired time has been\nreached\n• STOP → IDLE automatically\nThe FSM receives the Start signal and comparator output as inputs and generates reset and\nbeep signals as outputs."}, {"number": 7, "question": "What do the transition labels \"If Start\", \"If Comp\", and \"always\" mean?", "answer": "Transition labels specify when the FSM changes state.\n• If Start means the transition occurs only when the Start input becomes active.\n• If Comp means the transition occurs only when the comparator output becomes\nactive.\n• always means the transition always occurs at the next clock edge, regardless of the\ninputs.\nIf no transition condition is satisfied, the FSM simply remains in its current state, even if this\nself-loop is not explicitly drawn in the diagram."}, {"number": 8, "question": "Describe the three parts of the Verilog implementation of an FSM.", "answer": "The implementation consists of three logical parts:\n\n1. State register – stores the current state using flip-flops and updates it on every\nclock edge or reset.\n2. Next-state logic – calculates the next state from the current state and inputs using\ncombinational logic.\n3. Output logic – generates output signals depending on the current state.\nSeparating these three parts makes the code easier to understand, debug, and maintain."}, {"number": 9, "question": "What are the outputs in each state of the timer FSM?", "answer": "Each state performs a different action:\n• IDLE: resetcounter = 1, keeping the counter reset.\n• RESETCNT: resetcounter = 1 to ensure the counter starts from zero.\n• COUNT: enablecnt = 1 so the counter counts.\n• STOP: beep = 1 to activate the speaker.\nOnly the outputs required for a given state are active; all others remain zero."}, {"number": 10, "question": "What are glitches and why are they a problem?", "answer": "Glitches are short unwanted pulses at the outputs caused by different propagation delays\nin combinational logic. Even if the correct output value is eventually reached, these\ntemporary pulses can incorrectly trigger other circuits.\nThey are especially dangerous when outputs are fed back into the system or used as\ncontrol signals because even a very short pulse may cause incorrect operation."}, {"number": 11, "question": "How can output glitches be avoided?", "answer": "The lecture presents two approaches.\nThe first is to register the outputs using flip-flops. This completely removes glitches\nbecause outputs only change on clock edges. The disadvantage is a delay of one clock\ncycle.\nThe second is to use glitch-free combinational logic, which requires that only one input\nchanges at a time. Moore machines make this easier because outputs depend only on the\nstate and not directly on changing inputs."}, {"number": 12, "question": "What is Gray code encoding and when is it useful?", "answer": "Gray code is a state encoding in which consecutive states differ by only one bit.\nBecause only one flip-flop changes during each transition, switching activity, power\nconsumption, and the possibility of glitches are reduced. Gray code works especially well\nwhen the FSM follows a simple sequential path. If the state diagram contains many jumps\nor branches, Gray code loses much of its advantage."}, {"number": 13, "question": "What is one-hot encoding and what are its advantages?", "answer": "In one-hot encoding, every state has its own flip-flop. At any time exactly one flip-flop\ncontains a logic 1, while all others are 0.\nIts advantages are:\n• very simple next-state logic,\n• minimal combinational logic at the outputs,\n• reduced chance of glitches,\n• fast implementation in modern FPGAs.\n\nIts main disadvantage is that it requires one flip-flop per state, so it uses more hardware\nresources than binary or Gray encoding."}, {"number": 14, "question": "Compare binary, Gray, and one-hot state encoding.", "answer": "Each encoding has different strengths.\n• Binary encoding uses the fewest flip-flops and is hardware-efficient, but more bits\nmay change during transitions.\n• Gray encoding changes only one bit between neighboring states, reducing\nswitching activity and helping prevent glitches in sequential state transitions.\n• One-hot encoding uses the largest number of flip-flops but greatly simplifies logic,\noffers fast operation, and minimizes glitches.\nModern integrated circuits often use one-hot encoding because flip-flops are inexpensive."}, {"number": 15, "question": "Why might a designer choose a Moore machine instead of a Mealy machine, even if it requires more states?", "answer": "Although Moore machines often require more states, they have several important\nadvantages.\nTheir outputs depend only on the current state, making their behavior more predictable and\neasier to understand. Because outputs do not change immediately when inputs change,\nthey are less susceptible to glitches and timing problems. This also simplifies the design of\nglitch-free output logic.\nMealy machines may use fewer states and therefore be more compact, but they require\nadditional combinational logic and their outputs change directly with the inputs, increasing\nthe possibility of glitches. Therefore, Moore machines are often preferred in safety-critical\nor timing-sensitive applications."}]}, {"title": "Lecture MIPS", "cards": [{"number": 1, "question": "What is the simplified MIPS processor presented in this lecture?", "answer": "The processor is a simplified version of the MIPS (Microprocessor without Interlocked\nPipelined Stages) architecture. It is an 8-bit subset based on the MIPS32 architecture,\nwhich is a classic example of a RISC (Reduced Instruction Set Computing) processor. It has\neight general-purpose 8-bit registers ($0 to $7), where register $0 is permanently connected\nto zero. Although the processor uses 8-bit registers and an 8-bit program counter, it still\nuses the standard 32-bit MIPS instruction format. This simplified architecture makes it\neasier to understand processor design while keeping the important concepts of a real CPU."}, {"number": 2, "question": "Which instructions are supported by this processor?", "answer": "The processor supports a small instruction set that covers the essential processor\noperations:\n• Arithmetic: ADD, SUB\n• Logical: AND, OR\n• Comparison: SLT (Set Less Than)\n• Immediate instructions: ADDI, BEQ\n• Jump instruction: J\n• Memory instructions: LB (Load Byte) and SB (Store Byte)\nAlthough the instruction set is small, it is sufficient to demonstrate arithmetic, logical\noperations, branching, jumps, and communication with memory."}, {"number": 3, "question": "What are the three MIPS instruction formats?", "answer": "MIPS uses three instruction formats:\n• R-type for arithmetic and logical operations between registers.\n• I-type for instructions using an immediate constant or memory access.\n• J-type for jump instructions.\nAll formats begin with a 6-bit opcode. For R-type instructions, the opcode is always 000000,\nso an additional 6-bit function field (funct) specifies the exact operation such as ADD or\nSUB."}, {"number": 4, "question": "Why do R-type instructions require both an opcode and a funct field?", "answer": "All R-type instructions have the same opcode (000000). Therefore, the processor cannot\ndistinguish ADD, SUB, AND, OR, or SLT using only the opcode. Instead, it examines the 6-\nbit funct field at the end of the instruction. The combination of the opcode and funct\nuniquely determines which arithmetic or logical operation the ALU should perform."}, {"number": 5, "question": "How is the Fibonacci program implemented in assembly language?", "answer": "The program first initializes:\n• n = 8\n• f1 = 1\n• f2 = –1\n\nThen it repeatedly:\n1. Adds f1 and f2.\n2. Updates f2.\n3. Decrements n.\n4. Repeats until n becomes zero.\nWhen the loop finishes, the final Fibonacci value is stored into memory using the SB\ninstruction. This example demonstrates arithmetic instructions, branching, jumps,\nimmediate values, and memory access in a single program."}, {"number": 6, "question": "What are the main components of the processor architecture?", "answer": "The processor consists of two major parts:\n• Controller\n• Datapath\nThe controller generates all control signals required for the datapath. It contains the finite-state machine (FSM), the ALU decoder, and logic that controls the program counter.\nThe datapath contains the register file, ALU, multiplexers, registers, instruction register,\nand connections to memory. Together, these two blocks execute every instruction step by\nstep."}, {"number": 7, "question": "Why does this processor use a multi-cycle architecture?", "answer": "Instead of executing one instruction in a single clock cycle, each instruction is divided into\nseveral stages:\n• Fetch\n\n• Decode\n• Execute\n• Memory access (if needed)\n• Write-back\nThis allows the same hardware components, especially the ALU and memory interface, to\nbe reused during different stages. As a result, the processor is much simpler and requires\nless hardware than a single-cycle implementation."}, {"number": 8, "question": "Why does fetching one instruction require four clock cycles?", "answer": "Although every instruction is 32 bits long, the processor communicates with memory\nthrough an 8-bit data bus.\nTherefore, one instruction must be fetched one byte at a time:\n• State 0 fetches byte 0\n• State 1 fetches byte 1\n• State 2 fetches byte 2\n• State 3 fetches byte 3\nEach byte is stored in one part of the instruction register until the complete 32-bit\ninstruction has been assembled."}, {"number": 9, "question": "Explain how a SUB instruction is executed.", "answer": "The execution consists of several stages:\n1. Fetch the instruction from memory.\n2. Decode it and read the two source registers into temporary registers A and B.\n3. Execute the subtraction in the ALU. The ALU decoder examines the funct field and\ngenerates the SUB control signal.\n\n4. Store the result in a temporary result register.\n5. Write the result back into the destination register.\nAfter this, the controller returns to the fetch state to execute the next instruction."}, {"number": 10, "question": "How does the processor execute a BEQ (Branch if Equal) instruction?", "answer": "The processor first computes the potential branch address:\nPC + immediate × 4\nAt the same time, it reads the two source registers. The ALU subtracts the register values. If\nthe subtraction result is zero, then the registers are equal. When both the Branch signal\nand the Zero signal are active, the program counter is updated with the branch address.\nOtherwise, execution continues sequentially."}, {"number": 11, "question": "Explain how the SB (Store Byte) instruction works.", "answer": "The processor:\n1. Reads the base register.\n2. Adds the immediate offset using the ALU.\n3. Uses this result as the memory address.\n4. Sends the contents of the second register to memory.\n5. Activates the MemWrite signal.\nOn the next clock edge, the memory stores the byte at the calculated address."}, {"number": 12, "question": "Explain how the LB (Load Byte) instruction works.", "answer": "The processor first computes the memory address by adding the base register and the\nimmediate value.\nNext:\n• memory reads one byte,\n• the byte is stored in the data register,\n• finally, the data register writes the value into the destination register.\nUnlike SB, which writes to memory, LB transfers data from memory into the register file."}, {"number": 13, "question": "What is the purpose of the ALU decoder?", "answer": "The ALU decoder converts two inputs:\n• the ALUOp signal from the controller,\n• the funct field from R-type instructions,\ninto a 3-bit ALUControl signal.\nThis control signal tells the ALU whether it should perform addition, subtraction, AND, OR,\nor SLT. For non-R-type instructions, the controller alone determines the ALU operation,\nwhile for R-type instructions the decoder also examines the funct field."}, {"number": 14, "question": "What is the role of the finite-state machine (FSM) inside the controller?", "answer": "The FSM controls the execution of every instruction.\nIt determines:\n\n• which state comes next,\n• which control signals are active,\n• when memory is accessed,\n• when registers are written,\n• when the ALU performs an operation,\n• when the program counter is updated.\nEssentially, the FSM coordinates every step of instruction execution and ensures the\ndatapath performs the correct actions in the correct order."}, {"number": 15, "question": "Why is the processor divided into a controller and a datapath?", "answer": "Separating the processor into a controller and a datapath simplifies both the design and\nimplementation.\nThe controller decides what should happen by generating control signals using the FSM\nand ALU decoder.\nThe datapath performs the actual operations: storing data in registers, executing\narithmetic in the ALU, reading and writing memory, and updating the program counter.\nThis separation makes the processor modular, easier to understand, easier to debug, and\neasier to extend with new instructions."}]}, {"title": "Lecture Verilog Hardware Description Language - Introduction", "cards": [{"number": 1, "question": "Why were Hardware Description Languages (HDLs) developed?", "answer": "Hardware Description Languages were developed because digital circuits became too\ncomplex to design using traditional schematic diagrams. As integrated circuits grew in size\nand contained more transistors, drawing circuits by hand became slow, error-prone, and\ndifficult to maintain. Large schematics were often understandable only by the original\ndesigner, making teamwork and documentation difficult. HDLs solved this problem by\nallowing engineers to describe hardware using text, which is easier to read, modify,\nsimulate, and share."}, {"number": 2, "question": "How did the invention of the integrated circuit lead to the development of HDLs?", "answer": "The invention of the integrated circuit in 1959 by Jack Kilby and Robert Noyce made it\npossible to place many electronic components on a single chip. As transistor counts\nincreased over the following decades, digital systems became much more powerful but\nalso much more complex. Manual design methods could no longer keep up with this\ngrowth. This increasing complexity created the need for Hardware Description Languages,\nwhich allow engineers to describe large digital systems efficiently using code instead of\nschematics."}, {"number": 3, "question": "What is Moore's Law, and why is it important?", "answer": "Moore's Law was proposed by Gordon Moore in 1965. It states that the number of\ntransistors on an integrated circuit roughly doubles every two years. This trend resulted in\nincreased computing power, greater system complexity, and more functionality on a single\nchip. Because digital systems became increasingly complex, engineers needed better\ndesign methods and CAD tools, including Hardware Description Languages, to manage this\ncomplexity efficiently."}, {"number": 4, "question": "How did VHDL originate?", "answer": "VHDL was developed as part of a U.S. Department of Defense project. The DoD asked\nTexas Instruments, IBM, and Intermetrics to create a standardized language for\ndocumenting digital systems. The result was VHDL, which stands for Very High-Speed\nIntegrated Circuit Hardware Description Language. The first version was released in\n1985. Initially, it was intended for documentation and simulation rather than hardware\nsynthesis, but it later evolved into a complete hardware design language."}, {"number": 5, "question": "How did Verilog originate, and how is its history different from VHDL?", "answer": "Verilog was developed independently from VHDL. It was created in 1983 by Automated\nIntegrated Design Systems as a language specifically for logic simulation. Unlike VHDL, it\nwas not developed under a government contract. Later, the company became Gateway\nDesign Automation, which was acquired by Cadence in 1990. Cadence eventually made\nVerilog publicly available, helping it become one of the most widely used HDLs in industry."}, {"number": 6, "question": "Why did Verilog become so popular?", "answer": "Verilog became popular for several reasons. Its syntax is similar to the C programming\nlanguage, making it familiar to many engineers and programmers. It provides excellent\nsupport for simulation, allowing designers to verify functionality early in development. It\nalso enables rapid development of digital systems. Because of these advantages, Verilog\nbecame widely used in both industry and academia, especially for ASIC and custom\nintegrated circuit design."}, {"number": 7, "question": "What is logic synthesis?", "answer": "Logic synthesis is the process of converting a hardware description written in an HDL into a\ngate-level circuit that can be physically implemented in hardware. Instead of manually\ntranslating HDL code into logic gates, synthesis software performs this automatically. A\nmajor breakthrough occurred when Synopsys introduced synthesis directly from HDL code\nin 1986, allowing engineers to use the same HDL description for both simulation and\nhardware implementation. This greatly reduced design time and errors."}, {"number": 8, "question": "What is the difference between simulation and synthesis?", "answer": "Simulation checks whether a hardware design behaves correctly without actually building\nthe hardware. It can be performed at many abstraction levels and even with constructs that\ncannot be implemented physically.\nSynthesis, on the other hand, converts HDL code into actual hardware logic. Not every HDL\nconstruct can be synthesized. Some language features are intended only for simulation or\nare too abstract to generate reliable hardware. Therefore, designers must understand\nwhich parts of HDL are synthesizable."}, {"number": 9, "question": "What are the abstraction levels used in digital design?", "answer": "The lecture describes several abstraction levels:\n• System level defines overall system requirements.\n• Algorithmic level describes algorithms and functionality.\n• Register Transfer Level (RTL) describes data movement between registers and is\nthe primary level for Verilog and VHDL design.\n\n• Gate level describes logic gates and flip-flops.\n• Circuit level models transistors and analog behavior.\n• Material level describes semiconductor fabrication.\nAs we move downward, more implementation details are added. HDLs are mainly used\nfrom the algorithmic level down to the gate level."}, {"number": 10, "question": "Compare Verilog and VHDL.", "answer": "Verilog and VHDL are the two dominant Hardware Description Languages.\nVHDL:\n• Developed by the U.S. Department of Defense.\n• Strongly typed.\n• More verbose and strict.\n• Often preferred in safety-critical systems such as aerospace and defense.\nVerilog:\n• Developed independently by industry.\n• Has syntax similar to C.\n• More concise and flexible.\n• Less strict with data types.\n• Very popular in commercial IC and FPGA design because of its simplicity and\nextensive community support.\nBoth languages are industry standards and can be used for simulation and synthesis of\ndigital systems."}]}, {"title": "Lecture Verilog Hardware Description Language", "cards": [{"number": 1, "question": "What is a Verilog module?", "answer": "A module is the basic building block of every Verilog design. It represents a self-contained\nhardware component with clearly defined inputs and outputs. You can think of a module as\na \"black box\" whose interface is visible from the outside, while its internal implementation\nremains hidden. Every Verilog design consists of one or more modules, allowing large\nsystems to be built hierarchically from smaller, reusable components. A module begins\nwith the module keyword and ends with endmodule."}, {"number": 2, "question": "What are the main parts of a Verilog module?", "answer": "A Verilog module has three main parts:\n• the module declaration, which gives the module its name,\n• the port list, which defines the inputs, outputs, and optionally bidirectional ports,\n• the module body, which contains the internal logic, signal declarations,\nassignments, and instantiated submodules.\nThe module definition is closed with the endmodule keyword. This structure makes Verilog\ndesigns modular and easy to reuse."}, {"number": 3, "question": "What are the most important syntax rules in Verilog?", "answer": "Several syntax rules are essential:\n• Verilog is case-sensitive, so clk, Clk, and CLK are different identifiers.\n• All language keywords such as module, input, and output must be written in\nlowercase.\n• Every statement must end with a semicolon.\n• Line breaks are only for readability—they do not terminate statements.\n• Comments should be used to explain the purpose of the code and improve\nreadability.\nFollowing these rules helps avoid many common programming errors."}, {"number": 4, "question": "What logic values can a Verilog signal have?", "answer": "Unlike ordinary programming languages, Verilog uses four logic values:\n• 0 – logic low,\n• 1 – logic high,\n• X – unknown or uninitialized value,\n• Z – high-impedance or floating state.\nThe values X and Z are particularly useful during simulation because they help detect\ndesign errors such as conflicting drivers or disconnected signals. Verilog can also model\nsignal strengths when multiple drivers are connected to the same net."}, {"number": 5, "question": "What is the difference between wire and reg?", "answer": "The two most commonly used data types are wire and reg.\n\nA wire represents a physical connection. It does not store a value; instead, it continuously\nfollows the value driven onto it by another component. It is mainly used for combinational\nlogic and module interconnections.\nA reg behaves like storage. It retains its value until another assignment changes it and is\ntypically assigned inside procedural blocks such as always. Despite its name, a reg does\nnot always correspond to a physical hardware register—it depends on how it is used in the\ncode."}, {"number": 6, "question": "What is a vector, and why is it useful?", "answer": "A vector is a one-dimensional array of bits used to represent multi-bit signals such as\nbuses, registers, or ALU operands.\nFor example:\nverilogwire [7:0] Sum;\ndeclares an 8-bit signal.\nVectors allow designers to manipulate individual bits or groups of bits using indexing and\nslicing. They simplify the description of digital systems by replacing many individual wires\nwith a single multi-bit signal."}, {"number": 7, "question": "What is the difference between a vector and an array?", "answer": "A vector is a single multi-bit signal.\nAn array is a collection of vectors.\nFor example,\nverilogreg [7:0] Mem [0:4095];\nrepresents a memory containing 4096 elements, each 8 bits wide.\nVectors are mainly used for buses and registers, while arrays are commonly used to model\nmemories, ROMs, RAMs, and register files."}, {"number": 8, "question": "How are numbers written in Verilog?", "answer": "Verilog uses the syntax:\n<size>'<base><value>\nwhere:\n• size specifies the number of bits,\n• base may be:\no 'b for binary,\no 'o for octal,\no 'd for decimal,\no 'h for hexadecimal.\nFor example:\n•\n8'b10101010\n•\n8'd12\n•\n8'hFF\nIf the size is omitted, Verilog treats the value as a 32-bit number by default. Therefore,\nspecifying the bit width is considered good programming practice."}, {"number": 9, "question": "What happens if the assigned value has a different bit width than the destination?", "answer": "Verilog automatically adjusts the value.\nIf the assigned value is shorter, it pads the missing most significant bits with zeros.\n\nIf the value is longer, it truncates the most significant bits.\nFor example, assigning decimal 8 (binary 1000) to a 3-bit register produces 000 because\nthe leftmost bit is discarded. Designers must therefore carefully match bit widths to avoid\nunexpected behavior."}, {"number": 10, "question": "Why are parameters used in Verilog?", "answer": "Parameters define constants that can be reused throughout a module.\nTypical applications include:\n• bus widths,\n• memory sizes,\n• address widths,\n• configurable constants.\nInstead of writing the same number repeatedly, the designer defines a parameter once.\nFor example:\nverilogparameterBUS_WIDTH=64;\nChanging the parameter automatically updates every place where it is used, making\ndesigns easier to maintain and reuse."}, {"number": 11, "question": "What are bitwise operators?", "answer": "Bitwise operators perform logical operations independently on each bit of their operands.\nCommon operators include:\n•\n~ NOT\n•\n& AND\n\n•\n| OR\n•\n^ XOR\n•\n~^ XNOR\n•\n<< left shift\n•\n>> right shift\nThese operators are widely used for masking, shifting, setting, or clearing individual bits\nwithin a vector."}, {"number": 12, "question": "What are reduction operators?", "answer": "Reduction operators apply a logical operation across every bit of a vector and produce a\nsingle-bit result.\nFor example:\n•\n&A returns 1 only if all bits are 1.\n•\n|A returns 1 if at least one bit is 1.\n•\n^A computes the parity of the vector.\nReduction operators are useful for checking flags, validating buses, and implementing\nparity generation or detection."}, {"number": 13, "question": "What is the difference between bitwise operators and Boolean operators?", "answer": "Bitwise operators operate on every individual bit of a signal.\nBoolean operators evaluate an entire expression as either TRUE or FALSE, producing only a\none-bit result.\n\nFor example:\n•\nA & B performs an AND on every bit.\n•\nA && B checks whether both operands are logically true.\nBoolean operators are mainly used inside if statements, always blocks, and other control\nstructures."}, {"number": 14, "question": "What are relational operators used for?", "answer": "Relational operators compare two values and return either TRUE (1) or FALSE (0).\nThe available operators are:\n•\n==\n•\n!=\n•\n<\n•\n>\n•\n<=\n•\n>=\nThey are commonly used in conditional statements to compare counters, addresses,\nregister values, or other signals. The result of every comparison is always a single logic bit."}, {"number": 15, "question": "Why is modular design important in Verilog?", "answer": "Modular design allows complex digital systems to be built from small, reusable modules.\nEach module performs one specific function and communicates with other modules\nthrough clearly defined ports. Modules can instantiate other modules, creating a hierarchy\nsimilar to building with blocks.\n\nThis approach improves readability, simplifies debugging, encourages code reuse, and\nmakes large projects easier to develop and maintain. It also allows different engineers to\nwork on separate modules simultaneously."}, {"number": 16, "question": "What is the purpose of the assign statement in Verilog?", "answer": "The assign statement is used to describe continuous assignments. It continuously drives\nthe value of a net, usually a wire, based on the expression on the right-hand side.\nWhenever one of the input signals changes, the output is updated automatically without\nwaiting for a clock edge. Therefore, assign is primarily used for combinational logic.\nFor example:\nassign y = a & b;\nWhenever either a or b changes, y is immediately recalculated.\nUnlike assignments inside an always block, a continuous assignment is always active and\ndoes not execute sequentially. It continuously represents the behavior of combinational\nhardware."}, {"number": 17, "question": "What is the difference between a continuous assignment and a procedural assignment?", "answer": "A continuous assignment uses the assign keyword and continuously drives a wire.\nA procedural assignment is placed inside an always or initial block and normally\nassigns values to reg variables.\nThe main differences are:\n• Continuous assignments model combinational logic directly.\n• Procedural assignments execute only when the always block is triggered.\n• Continuous assignments cannot assign values to reg.\n• Procedural assignments cannot directly drive wire outputs without additional logic.\n\nIn practice:\n•\nassign is used for simple combinational circuits.\n•\nalways is used for more complex combinational or sequential logic."}, {"number": 18, "question": "What is the conditional operator (?:) in Verilog?", "answer": "The conditional operator provides a compact way to implement an if-else decision.\nIts syntax is:\ncondition ? expression1 : expression2;\nIf the condition is true, the first expression is selected.\nIf the condition is false, the second expression is selected.\nFor example,\nAssign max = (a > b) ? a : b;\nassigns the larger of a and b to max.\nThe conditional operator is synthesizable and usually produces a multiplexer in hardware."}, {"number": 19, "question": "Why is the conditional operator often preferred over an if statement?", "answer": "The conditional operator is often preferred for simple combinational decisions because it\nis shorter and easier to read.\nFor example,\nAssign y = sel ? a : b;\nis much simpler than writing an entire always block containing an if statement.\nBoth implementations generate essentially the same hardware—a multiplexer—but the\nconditional operator makes the designer's intention clearer when only two choices exist."}, {"number": 20, "question": "What is an always block?", "answer": "An always block describes procedural behavior.\nUnlike an assign statement, it executes only when one of the signals in its sensitivity list\nchanges.\nThe general form is\nalways @(...)\nbegin\n    ...\nend\nInside an always block we can write:\n• if statements\n• case statements\n• loops\n• procedural assignments\nAn always block can model either combinational logic or sequential logic depending on its\nsensitivity list."}, {"number": 21, "question": "What determines whether an always block models combinational or sequential logic?", "answer": "The sensitivity list determines the behavior.\nIf every input signal appears in the sensitivity list,\nalways @(a or b or sel)\nor\nalways @(*)\nthe block models combinational logic.\nIf the sensitivity list contains a clock edge,\nalways @(posedge clk)\n\nor\nalways @(negedge clk)\nthe block models sequential logic, such as flip-flops or registers.\nThus, the sensitivity list tells the synthesizer what type of hardware should be generated."}, {"number": 22, "question": "Why is always @(*) recommended for combinational logic?", "answer": "The notation\nalways @(*)\nautomatically includes every signal used inside the block in the sensitivity list.\nThis prevents common programming mistakes where a signal is forgotten.\nIf a signal is omitted manually, simulation and synthesized hardware may behave\ndifferently.\nTherefore, always @(*) is safer, easier to maintain, and is the recommended style in\nmodern Verilog."}, {"number": 23, "question": "How is combinational logic modeled inside an always block?", "answer": "Combinational logic is modeled by:\n• using always @(*),\n• assigning every output in every possible execution path,\n• avoiding memory behavior.\nFor example,\nalways @(*) begin\n\nif(sel)\n        y=a;\nelse y=b;\nend\nSince y receives a value regardless of the condition, no storage element is inferred.\nThe resulting hardware is simply a multiplexer."}, {"number": 24, "question": "What happens if not all outputs are assigned inside a combinational always block?", "answer": "If an output is not assigned in every possible execution path, the synthesizer assumes the\noutput must remember its previous value.\nThis causes a latch to be inferred.\nLatches are usually undesirable because they introduce memory into what should be\npurely combinational logic.\nTherefore, every output should receive an assignment under every possible condition."}, {"number": 25, "question": "How is a D flip-flop modeled in Verilog?", "answer": "A D flip-flop is modeled using a clocked always block.\nFor example,\nalways @(posedge clk)\n    q <= d;\nAt every rising edge of the clock, the value of d is copied into q.\nBetween clock edges, q keeps its previous value.\nThis exactly matches the behavior of a physical D flip-flop."}, {"number": 26, "question": "Why does a flip-flop store information?", "answer": "Unlike combinational logic, whose outputs depend only on present inputs, a flip-flop has\nmemory.\nAfter a clock edge, it stores the input value internally.\nEven if the input changes afterward, the stored value remains unchanged until the next\nactive clock edge.\nThis ability to remember previous information makes flip-flops the basic storage elements\nused in registers, counters, memories, and finite-state machines."}, {"number": 27, "question": "What is the difference between blocking (=) and non-blocking (<=) assignments?", "answer": "A blocking assignment (=) executes immediately.\nThe next statement waits until the assignment has completed.\nA non-blocking assignment (<=) schedules the update for the end of the current\nsimulation time step.\nIn practice:\n• Blocking assignments are generally used in combinational always blocks.\n• Non-blocking assignments are used in clocked sequential always blocks.\nUsing non-blocking assignments prevents race conditions and models hardware registers\ncorrectly."}, {"number": 28, "question": "Why are non-blocking assignments recommended for flip-flops?", "answer": "Real flip-flops update simultaneously on a clock edge.\nNon-blocking assignments reproduce this behavior.\n\nFor example,\nalways @(posedge clk)\nbegin\nq1 <=d;\nq2 <=q1;\n\nend\nBoth updates occur together after the clock edge.\nIf blocking assignments were used, q2 could receive the new value of q1 immediately,\nwhich does not represent real hardware.\nTherefore, non-blocking assignments produce more accurate and reliable sequential\ndesigns."}, {"number": 29, "question": "What hardware does an if statement usually generate?", "answer": "The generated hardware depends on the context.\nInside a combinational always block, an if statement usually synthesizes to a\nmultiplexer.\nInside a clocked always block, it typically controls what value is loaded into a flip-flop.\nIf assignments are missing from some branches, the synthesizer may instead generate a\nlatch.\nTherefore, the same Verilog statement can produce different hardware depending on where\nit is used."}, {"number": 30, "question": "Compare assign, the conditional operator, and always.", "answer": "These are three common ways to describe hardware.\n•\nassign\no Continuous assignment.\no Used for simple combinational logic.\n\no Drives wire signals continuously.\n• Conditional operator (?:)\no Compact way to implement simple combinational decisions.\no Commonly synthesizes into multiplexers.\no Often used together with assign.\n•\nalways block\no Used for more complex logic.\no Can describe both combinational and sequential circuits.\no Supports if, case, loops, and procedural assignments.\nIn practice, designers use assign for simple expressions, the conditional operator for\nsimple selections, and always blocks whenever more complicated behavior or sequential\nlogic is required."}]}, {"title": "Lecture Karnaugh Maps", "cards": [{"number": 1, "question": "What is a Karnaugh map, and why is it used?", "answer": "A Karnaugh map (or K-map) is a graphical method used to simplify Boolean logic functions.\nIt is a visual representation of a truth table in which each cell corresponds to one\ncombination of input variables. Instead of manipulating long Boolean expressions\nalgebraically, the designer groups adjacent cells containing 1s to find simpler expressions.\nThe main purpose of a Karnaugh map is to reduce the number of logic gates needed to\nimplement a circuit. Simpler circuits require fewer gates, consume less power, are usually\nfaster, and are easier to understand and maintain.\nKarnaugh maps are most practical for functions with about four variables, although they\ncan still be used for up to six variables."}, {"number": 2, "question": "How is a Karnaugh map constructed from a truth table?", "answer": "The construction begins with the truth table.\nEvery row of the truth table corresponds to one cell in the Karnaugh map. Whenever the\noutput of the truth table is 1, the corresponding K-map cell is filled with a 1.\nThe rows and columns are arranged using Gray code, not ordinary binary counting. Gray\ncode ensures that neighboring cells differ in only one variable. This property is essential\nbecause adjacent cells can then be grouped during minimization.\nFor a function with n variables, the Karnaugh map contains 2ⁿ cells."}, {"number": 3, "question": "Why is Gray code used in Karnaugh maps?", "answer": "Gray code is used because neighboring cells differ in exactly one variable.\nThis property allows two adjacent minterms to be combined into a simpler Boolean\nexpression by eliminating the variable that changes.\nIf ordinary binary counting were used, adjacent cells could differ in several variables,\nmaking simplification impossible.\nTherefore, Gray code is the key feature that makes Karnaugh maps useful for logic\nminimization."}, {"number": 4, "question": "How is a Boolean function minimized using a Karnaugh map?", "answer": "The simplification process consists of several steps.\nFirst, all cells containing a 1 are identified.\n\nNext, neighboring 1s are grouped into the largest possible rectangular groups whose\nsizes are powers of two, such as 1, 2, 4, 8, or 16 cells.\nThese largest groups are called prime implicants.\nFor each group, the variables that change within the group are eliminated, while the\nvariables that remain constant become the corresponding AND term.\nFinally, all resulting AND terms are combined using OR operations to obtain the simplified\nBoolean expression."}, {"number": 5, "question": "Why do variables disappear during minimization?", "answer": "A variable disappears because it changes value inside a group.\nFor example, if one cell contains A = 0 and the adjacent cell contains A = 1, while all other\nvariables remain identical, the variable A is not needed to describe the entire group.\nOnly the variables that remain constant throughout the whole group are included in the\nsimplified expression.\nThis is the reason why larger groups produce simpler Boolean expressions with fewer\nvariables."}, {"number": 6, "question": "What is a glitch in digital logic?", "answer": "A glitch is a short, unwanted pulse that appears temporarily at the output of a\ncombinational circuit.\nIt is not caused by incorrect logic but by different propagation delays through the logic\ngates.\nDuring an input transition, one signal path may update slightly earlier than another. For a\nvery short time, the output may take an incorrect value before settling to the correct one.\nAlthough glitches are usually very short, they can still cause problems if other circuits react\nto them."}, {"number": 7, "question": "Why can a multiplexer produce a glitch?", "answer": "The lecture uses a two-input multiplexer as an example.\nThe multiplexer is described by\n𝑌= 𝑆𝑒𝑙⋅𝐴+ 𝑆𝑒𝑙⋅𝐵\nSuppose both inputs are equal to 1.\nIdeally, changing the select signal should leave the output equal to 1.\nHowever, because the two AND gates have different delays, one product term may become\n0 before the other becomes 1.\nFor a very short time, both product terms become 0, so the OR gate also outputs 0, creating\na temporary glitch.\nAfter both signals stabilize, the output returns to the correct value."}, {"number": 8, "question": "When are glitches a problem?", "answer": "In synchronous digital systems, glitches are often not a problem, provided they disappear\nbefore the next clock edge.\nSince flip-flops only sample their inputs on the active clock edge, a short glitch between\nclock edges is ignored.\nHowever, glitches become dangerous when:\n• they feed asynchronous circuits,\n• they drive outputs directly,\n• they trigger other combinational logic,\n• or they appear at outputs of finite-state machines that are not registered.\nTherefore, designers must evaluate whether glitches can influence the surrounding\nhardware."}, {"number": 9, "question": "How can a Karnaugh map help identify possible glitches?", "answer": "The Karnaugh map can reveal potential glitches by examining how adjacent groups are\nformed.\nIf two neighboring cells belong to different groups that do not overlap, changing the\ncorresponding variable requires one group to switch off before the other switches on.\nBecause these transitions are not perfectly simultaneous in real hardware, a temporary\nglitch may occur.\nThus, the Karnaugh map not only simplifies logic but also helps predict whether hazards\nmay exist in the implementation."}, {"number": 10, "question": "How can glitches be eliminated?", "answer": "The lecture demonstrates removing glitches by adding an extra overlapping group in the\nKarnaugh map.\nThis additional group acts as a bridge between the two original groups.\nFor the multiplexer example, the additional group corresponds to the term\n𝐴⋅𝐵\nNotice that this term does not contain the select signal.\nTherefore, when the select input changes, this additional term remains active and keeps\nthe output equal to 1.\nAlthough this introduces an extra logic gate, it guarantees that the output never briefly\ndrops to 0, resulting in a glitch-free implementation. This technique is called adding a\nconsensus term or redundant implicant to eliminate hazards."}]}, {"title": "Lecture Counters", "cards": [{"number": 1, "question": "How does binary addition work?", "answer": "Binary addition follows the same principle as decimal addition. The addition starts from the\nleast significant bit (LSB) and proceeds toward the most significant bit (MSB).\nAt each bit position, the two input bits and any carry from the previous position are added\ntogether. If the result cannot be represented with one bit, a carry is generated and passed\nto the next higher bit.\nThus, every bit position produces two outputs:\n• the sum bit, and\n• the carry-out.\nAfter processing the most significant bit, there may also be a final carry-out that represents\nan overflow into an additional bit. Designing digital adders means implementing this\nprocess using combinational logic."}, {"number": 2, "question": "What is a full adder?", "answer": "A full adder is a combinational circuit that adds three one-bit inputs:\n• input A,\n• input B,\n• carry input Cin.\nIt produces two outputs:\n• Sum, which is the result bit,\n• Carry-out (Cout), which is passed to the next stage.\n\nUnlike a half adder, the full adder can process an incoming carry, making it suitable for\nbuilding multi-bit adders. Every bit of a multi-bit adder is usually implemented using one\nfull adder."}, {"number": 3, "question": "What is a half adder, and how does it differ from a full adder?", "answer": "A half adder is the simplest binary adder.\nIt adds only two input bits and produces:\n• Sum = A XOR B\n• Carry = A AND B\nUnlike a full adder, it has no carry input, so it cannot directly be used for adding multi-bit\nnumbers except at the least significant position.\nA full adder, on the other hand, accepts a carry input in addition to A and B, allowing it to be\ncascaded with other full adders."}, {"number": 4, "question": "How can a full adder be built from two half adders?", "answer": "A common implementation uses two half adders connected in series.\nThe first half adder adds A and B.\nThe second half adder adds the first sum and the carry input Cin.\nThe two carry outputs are then combined using an OR gate.\nThis implementation reuses the simpler half-adder circuit and results in:\n• two XOR gates for the sum,\n• two AND gates and one OR gate for the carry.\n\nAlthough the carry logic becomes slightly deeper, this design is simple and widely used in\npractice."}, {"number": 5, "question": "What is a ripple carry adder?", "answer": "A ripple carry adder (RCA) is formed by connecting several full adders in series.\nEach full adder computes one bit of the result.\nThe carry-out of one stage becomes the carry-in of the next stage.\nBecause every stage must wait for the previous carry, the carry \"ripples\" through the entire\nadder before the final result is available.\nThe ripple carry adder is easy to design and requires relatively little hardware, but it\nbecomes slower as the number of bits increases."}, {"number": 6, "question": "What is the main disadvantage of the ripple carry adder?", "answer": "Its main disadvantage is speed.\nEvery full adder must wait until the previous carry has been computed.\nAs the number of bits increases, the total propagation delay also increases because the\ncarry must travel through every stage.\nTherefore, ripple carry adders become relatively slow for large word sizes such as 32-bit or\n64-bit processors.\nThis limitation motivated the development of faster adder architectures such as the carry\nlook-ahead adder."}, {"number": 7, "question": "What is a carry look-ahead (CLA) adder?", "answer": "A carry look-ahead adder improves performance by calculating carry signals in parallel\nrather than waiting for them to ripple through each full adder.\nTo achieve this, additional combinational logic computes every carry directly from the\ninputs.\nAs a result, the delay becomes almost independent of the number of bits, making the CLA\nmuch faster than the ripple carry adder.\nThe trade-off is increased hardware complexity because additional logic is required to\ngenerate the carry signals."}, {"number": 8, "question": "What are carry generation and carry propagation?", "answer": "Carry look-ahead adders use two important concepts:\nGenerate (g):\nA stage generates a carry when A and B alone guarantee that the carry-out is 1.\n𝑔= 𝐴⋅𝐵\nPropagate (p):\nA stage propagates a carry if an incoming carry passes through to the output.\n𝑝= 𝐴+ 𝐵\nUsing these two signals, the carry values for every stage can be computed directly without\nwaiting for previous stages, enabling much faster addition."}, {"number": 9, "question": "How can Verilog describe an adder without explicitly connecting full adders?", "answer": "Verilog supports arithmetic operators directly.\nInstead of manually instantiating full adders, the designer can simply write\nassign {Cout, Sum} = A+B;\nThe synthesizer automatically generates the required hardware.\nThe concatenation operator {} stores the carry-out and sum together.\nThis high-level description is shorter, easier to understand, and allows synthesis tools to\noptimize the resulting circuit automatically."}, {"number": 10, "question": "How can a subtractor be built using an adder?", "answer": "Instead of building a separate subtraction circuit, subtraction is performed using two's\ncomplement.\nTo compute\n𝐴−𝐵,\nthe circuit actually computes\n𝐴+ (−𝐵).\nThe negative value is obtained by:\n1. inverting every bit of B,\n2. adding 1.\nTherefore, only two additional operations are needed:\n• invert B,\n• set the initial carry input to 1.\nThis approach allows the same hardware to perform both addition and subtraction, saving\nlogic resources."}, {"number": 11, "question": "What is the difference between synchronous and asynchronous counters?", "answer": "In a synchronous counter, every flip-flop receives the clock simultaneously.\nTherefore, all outputs change together on the same clock edge.\nIn an asynchronous (ripple) counter, only the first flip-flop receives the clock directly.\nEach following flip-flop is clocked by the output of the previous stage.\nBecause of propagation delays, different bits change at different times.\nSynchronous counters are faster and more reliable, while ripple counters are simpler and\ncommonly used as frequency dividers."}, {"number": 12, "question": "What are shift-register counters, and what are they used for?", "answer": "Shift-register counters consist of flip-flops connected in series.\nData moves one position during each clock cycle.\nBesides simple data storage, shift registers are used for:\n• introducing delays,\n• pipelining,\n• state encoding,\n• implementing special counters such as LFSRs.\nBecause signals pass directly between flip-flops, designers must also consider hold-time\nviolations and may need additional buffers or delays."}, {"number": 13, "question": "What is a Johnson counter?", "answer": "A Johnson counter is a shift-register counter in which the inverted output is fed back to the\ninput.\nAlthough an N-bit shift register has 2𝑁 possible states, a Johnson counter cycles through\n2N valid states.\nThe remaining states form unwanted cycles, so the counter must be initialized correctly\nusing reset.\nJohnson counters are attractive because they require very little additional logic and\ngenerate predictable state sequences."}, {"number": 14, "question": "What is a pseudo-random bit sequence (PRBS) counter?", "answer": "A PRBS counter is a type of linear feedback shift register (LFSR).\nSelected outputs are fed back through XOR or XNOR gates to generate a sequence that\nappears random.\nFor an N-bit LFSR, the maximum sequence length is\n2𝑁−1.\nAlthough the sequence looks random, it is actually deterministic and repeats after its\nmaximum period.\nPRBS generators are widely used for communication testing, random pattern generation,\nand scramblers."}, {"number": 15, "question": "Why are two's complement numbers so useful in digital systems?", "answer": "Two's complement allows both positive and negative numbers to be processed using\nexactly the same hardware.\nInstead of designing separate circuits for subtraction, the processor converts subtraction\ninto addition:\n𝐴−𝐵= 𝐴+ (−𝐵).\nThe negative number is obtained by inverting every bit and adding one.\nThis representation greatly simplifies arithmetic hardware because the same adder can\nperform:\n• addition,\n• subtraction,\n• increment,\n• decrement,\nand forms the basis for more complex arithmetic operations such as multiplication,\ndivision, and even functions like sine or logarithm using iterative algorithms."}]}, {"title": "Lecture 8 – Synchronous Design Basics and Setup and Hold Time", "cards": [{"number": 1, "question": "What is a synchronous digital circuit?", "answer": "A synchronous digital circuit is a circuit in which all storage elements, such as flip-flops,\nchange their state only at specific times determined by a clock signal.\nBetween clock edges, combinational logic computes the next values, while the flip-flops\nhold the current state. At the active clock edge, all flip-flops sample their inputs\nsimultaneously.\nThis organization makes the behavior of the circuit predictable because all state changes\noccur only at well-defined moments rather than continuously. Although most synchronous\nsystems use a single clock, more complex designs may use multiple clock phases."}, {"number": 2, "question": "What is the difference between synchronous and asynchronous design?", "answer": "The main difference is how state changes are controlled.\nIn a synchronous design, all flip-flops are controlled by a common clock. State changes\noccur only at clock edges.\nIn an asynchronous design, there is no global clock. State changes occur whenever input\nsignals change or when local completion signals indicate that an operation has finished.\nBecause synchronous circuits have predictable timing, they are easier to design, verify, and\ntest. Asynchronous circuits can potentially be faster and more power efficient, but they are\nconsiderably more difficult to design correctly due to timing hazards and synchronization\nissues."}, {"number": 3, "question": "Why is synchronous design so widely used?", "answer": "Synchronous design offers several important advantages.\nFirst, short glitches in combinational logic usually do not affect functionality because flip-flops sample data only on clock edges.\nSecond, synchronous circuits have better immunity to electrical noise since signals have\ntime to settle before being stored.\nAnother advantage is that the entire system can be paused or slowed simply by stopping or\nreducing the clock frequency, without losing its state.\nThese properties make synchronous systems easier to design, debug, and manufacture\nreliably, which explains why they dominate modern digital systems."}, {"number": 4, "question": "What are the main disadvantages of synchronous design?", "answer": "Despite its advantages, synchronous design has several drawbacks.\nThe maximum operating speed is limited by the slowest path in the circuit, even if most\npaths are much faster.\nEvery flip-flop switches with every clock cycle, even when data does not change, leading to\nunnecessary power consumption.\nSimultaneous switching also creates current spikes and electromagnetic interference.\nAnother challenge is transferring data between different clock domains, which requires\nadditional synchronization circuits.\nFinally, designing a low-skew clock distribution network becomes increasingly difficult as\nintegrated circuits grow larger."}, {"number": 5, "question": "What design rules should be followed in synchronous circuits?", "answer": "Reliable synchronous circuits follow several important rules.\nUnclocked bistables, such as transparent latches without proper clock control, should be\navoided because they are sensitive to glitches.\nPure combinational feedback loops are prohibited because they may never stabilize.\nMonostables and pulse generators should generally not be used because their pulse\nwidths depend on delays and are difficult to verify.\nClock and reset signals should be distributed through balanced fan-out trees rather than\nthrough ordinary combinational logic.\nThese rules ensure predictable timing and improve the reliability of large digital systems."}, {"number": 6, "question": "What are clock delay, clock skew, and clock jitter?", "answer": "These are three important timing parameters of clock distribution.\nClock delay is the time required for the clock signal to travel from its source to a flip-flop.\nClock skew is the difference in arrival times of the same clock edge at different flip-flops.\nClock jitter is the variation in the timing of clock edges caused by noise or imperfections in\nthe clock source.\nExcessive skew or jitter reduces timing margins and may lead to setup or hold time\nviolations. Therefore, minimizing these parameters is essential in high-speed digital\ncircuits."}, {"number": 7, "question": "Why are distributed clock trees preferred over centralized clocking?", "answer": "A centralized clocking scheme uses one large buffer to drive every flip-flop directly.\nAs circuits become larger, this approach leads to long delays, large currents, and high\npower consumption.\nDistributed clock trees solve this problem by using many smaller buffers placed throughout\nthe chip.\nThis reduces long current paths, spreads power dissipation more evenly, and helps\nminimize clock skew.\nModern electronic design automation tools automatically generate balanced clock trees\nduring physical design, making distributed clock trees the standard solution in today's\nintegrated circuits."}, {"number": 8, "question": "What are setup time and hold time?", "answer": "Setup time and hold time define the interval during which the input of a flip-flop must\nremain stable around the active clock edge.\nSetup time is the minimum time before the clock edge during which the input must already\nbe stable.\nHold time is the minimum time after the clock edge during which the input must remain\nunchanged.\nTogether they form the timing window in which the flip-flop reliably captures data.\nIf either requirement is violated, the stored value may become incorrect or unpredictable."}, {"number": 9, "question": "What is propagation delay?", "answer": "Propagation delay is the time between the active clock edge and the moment when the\noutput of a flip-flop changes.\nThis delay exists because the internal transistors require time to transfer the stored\ninformation from the input to the output.\nPropagation delay is usually larger than the hold time and must be considered together\nwith delays of the combinational logic when analyzing timing between two flip-flops."}, {"number": 10, "question": "Explain the timing analysis between two flip-flops.", "answer": "Consider two flip-flops connected by combinational logic.\nThe first flip-flop launches new data after a clock edge.\nThe signal then passes through the combinational logic before reaching the input of the\nsecond flip-flop.\nFor reliable operation, the new data must not arrive too early, which would violate the hold\ntime, nor too late, which would violate the setup time before the next clock edge.\nTherefore, the propagation delay of the first flip-flop, the combinational logic delay, and the\nclock distribution delays must all be considered together during timing analysis."}, {"number": 11, "question": "What is a hold time violation?", "answer": "A hold time violation occurs when the input of the receiving flip-flop changes too soon after\nthe active clock edge.\nIn this case, the previous value has not yet been safely stored, and the new value arrives\nbefore the hold time expires.\nCommon causes include:\n• very short combinational logic delays,\n• excessive clock skew,\n• poor clock tree design.\nUnlike setup violations, hold time violations cannot be fixed by lowering the clock\nfrequency because they occur immediately after the clock edge. Designers usually solve\nthem by increasing the data path delay or improving the clock distribution."}, {"number": 12, "question": "What is a setup time violation?", "answer": "A setup time violation occurs when the new input data arrives too late at the receiving flip-flop.\nThe input has not been stable for the required setup time before the next clock edge, so the\nflip-flop may capture the previous value or enter metastability.\nTypical causes are:\n• excessive combinational logic delay,\n• too high a clock frequency,\n• excessive clock skew.\nUnlike hold violations, setup violations can often be corrected by reducing the clock\nfrequency or by speeding up the combinational logic."}, {"number": 13, "question": "What are setup slack and hold slack?", "answer": "Slack represents the available timing margin.\nHold slack is the difference between the moment when the input changes and the required\nhold moment.\nA positive hold slack means the hold requirement is satisfied.\nSetup slack is the difference between the setup moment and the arrival time of the new\ndata.\nAgain, a positive value indicates that timing requirements are satisfied.\nNegative slack means a timing violation has occurred and the circuit may not function\ncorrectly."}, {"number": 14, "question": "How does clock frequency affect setup and hold timing?", "answer": "Clock frequency directly affects setup timing.\nIncreasing the clock frequency shortens the clock period, leaving less time for signals to\npropagate through the combinational logic.\nAs a result, setup slack decreases and setup violations become more likely.\nHowever, changing the clock frequency does not affect hold timing, because hold time\ndepends only on events immediately after the same clock edge.\nTherefore:\n• setup violations may be fixed by lowering the clock frequency,\n• hold violations require changes to the circuit itself, such as increasing path delay or\nreducing clock skew."}, {"number": 15, "question": "Why is setup and hold analysis essential in digital circuit design?", "answer": "Setup and hold analysis ensures that every flip-flop stores the correct value on every clock\ncycle.\nWithout this analysis, signals may arrive too early or too late, causing incorrect operation or\nmetastability.\nTiming analysis allows designers to determine the maximum safe clock frequency, verify\nthat all paths satisfy timing constraints, and identify critical paths that require optimization.\nBecause virtually every modern digital system is synchronous, setup and hold analysis is\none of the most important steps in digital integrated circuit design."}]}, {"title": "Lecture 7 (Part 2): Non-Volatile Memories", "cards": [{"number": 1, "question": "What is a non-volatile memory?", "answer": "A non-volatile memory is a memory that retains its stored information even when the\npower supply is removed.\nUnlike SRAM and DRAM, which lose their contents when power is turned off, non-volatile\nmemories preserve data for long periods. This makes them suitable for permanent storage\nsuch as SSDs, firmware, embedded systems, and microcontrollers.\nExamples include PROM, EEPROM, Flash memory, FeRAM, MRAM, ReRAM, and PCRAM."}, {"number": 2, "question": "What is PROM and how does it work?", "answer": "PROM stands for Programmable Read-Only Memory.\n\nIt can be programmed only once. Each memory cell contains a metal fuse.\nDuring programming, a high voltage vaporizes selected fuses. Once a fuse has been blown,\nit cannot be restored.\nBecause of this, PROM is permanent and cannot be rewritten.\nHistorically, PROM was widely used for firmware and microcode storage, but today it has\nlargely been replaced by rewritable memories."}, {"number": 3, "question": "What is EEPROM, and how is it different from PROM?", "answer": "EEPROM stands for Electrically Erasable Programmable Read-Only Memory.\nUnlike PROM, EEPROM can be electrically erased and reprogrammed many times.\nIts memory cells are based on transistors whose threshold voltage can be modified.\nAlthough EEPROM is rewritable, writing requires relatively high voltages, is slower than\nreading, and the number of write cycles is limited.\nThe main advantage over PROM is that the stored information can be updated without\nreplacing the chip."}, {"number": 4, "question": "What is a floating-gate transistor?", "answer": "A floating-gate transistor is the basic storage element used in EEPROM and Flash memory.\nIt contains two gates:\n• the normal control gate,\n• an electrically isolated floating gate.\nBecause the floating gate is completely surrounded by insulating oxide, electrical charge\ncan remain trapped there for many years.\nThe stored charge changes the transistor's threshold voltage.\n\nWhen the floating gate contains negative charge, the threshold voltage increases, making\nthe transistor harder to switch on.\nThis difference in threshold voltage stores one bit of information."}, {"number": 5, "question": "Why does charging the floating gate increase the threshold voltage?", "answer": "Negative electrons stored on the floating gate induce a positive charge in the transistor\nchannel.\nThis reduces the effective channel charge, meaning a larger gate voltage is needed before\nthe transistor begins conducting.\nTherefore, the threshold voltage increases.\nDuring reading, this threshold difference determines whether the transistor conducts or\nnot, allowing the stored bit to be detected."}, {"number": 6, "question": "What is Fowler–Nordheim tunneling?", "answer": "Fowler–Nordheim tunneling is a quantum mechanical effect used to move electrons\nthrough the thin oxide surrounding the floating gate.\nNormally, electrons cannot overcome the insulating barrier.\nHowever, when a very high electric field is applied, the barrier becomes thin enough that\nelectrons tunnel through it.\nThis effect is used both for programming and erasing EEPROM and Flash memories.\nIt allows charge to move onto or off the floating gate without physically damaging the\ntransistor."}, {"number": 7, "question": "How are EEPROM cells programmed and erased?", "answer": "Programming and erasing both involve changing the charge stored on the floating gate.\nDuring programming, electrons tunnel onto or away from the floating gate, depending on\nthe EEPROM design.\nDuring erasing, the polarity of the applied voltage is reversed so that electrons tunnel in the\nopposite direction.\nProgramming can usually be performed on individual memory cells, whereas erasing may\naffect larger groups of cells depending on the implementation.\nThe entire process relies on controlled tunneling through the oxide layer."}, {"number": 8, "question": "What is hot-carrier injection?", "answer": "Hot-carrier injection is another method used to charge the floating gate.\nInstead of quantum tunneling, electrons gain very high kinetic energy because of a large\nelectric field near the transistor drain.\nThese energetic electrons become \"hot\" enough to overcome the oxide barrier and enter\nthe floating gate.\nThis method has been widely used in many EEPROM and Flash technologies for\nprogramming memory cells."}, {"number": 9, "question": "What is Flash memory, and how does it differ from EEPROM?", "answer": "Flash memory is based on the same floating-gate principle as EEPROM.\nThe main difference is the memory cell structure.\n\nEEPROM cells contain two gates and allow individual-byte programming.\nFlash cells contain only one gate, making them much smaller.\nAs a result, Flash memory achieves much higher storage density and lower cost.\nModern NAND Flash connects many cells in series, allowing billions of cells to be\nintegrated into a single chip.\nThis makes Flash ideal for SSDs, USB drives, and memory cards."}, {"number": 10, "question": "How are Flash memory cells read, programmed, and erased?", "answer": "During reading, the selected word line receives a voltage between the thresholds of\nprogrammed and erased cells.\nThe remaining word lines receive higher voltages so they always conduct.\nDuring programming, high voltage charges the floating gate of selected cells.\nDuring erasing, a high voltage applied to the substrate causes electrons to tunnel out of\nthe floating gate.\nReading is selective, programming targets chosen cells, while erasing is usually performed\non entire memory blocks rather than individual cells."}, {"number": 11, "question": "Why does Flash memory wear out?", "answer": "Every programming and erase operation subjects the thin oxide around the floating gate to\nan extremely strong electric field.\nRepeated stress damages the oxide by creating defects and charge traps.\nOver time:\n• electrons begin leaking,\n\n• charge retention becomes worse,\n• erase operations become slower,\n• bit errors become more common.\nEventually the memory cell can no longer reliably store data and must be retired.\nThis is why SSD controllers use wear leveling and error correction techniques to maximize\nFlash lifetime."}, {"number": 12, "question": "What is MRAM and how does it store information?", "answer": "MRAM stands for Magnetoresistive RAM.\nUnlike Flash or EEPROM, MRAM stores information using magnetic orientation instead of\nelectrical charge.\nEach memory cell contains a magnetic tunnel junction with:\n• one fixed magnetic layer,\n• one free magnetic layer.\nIf both layers are parallel, the resistance is low.\nIf they are anti-parallel, the resistance is high.\nReading simply measures resistance, while writing changes the magnetic orientation using\nspin-polarized current.\nMRAM combines high speed, high endurance, and non-volatility."}, {"number": 13, "question": "What is ReRAM and how does it work?", "answer": "ReRAM stores data by changing the electrical resistance of a thin dielectric material.\nApplying voltage creates or destroys conductive filaments inside the dielectric.\n\nA low-resistance state represents one binary value, while a high-resistance state\nrepresents the other.\nReading uses a small voltage that measures resistance without changing the stored\ninformation.\nReRAM offers high speed, excellent scalability, and relatively simple fabrication, although\nresistance variability remains an important challenge."}, {"number": 14, "question": "What is FeRAM and what is its main disadvantage?", "answer": "FeRAM stores information using the polarization direction of a ferroelectric capacitor.\nChanging the polarization stores either a logical 0 or 1.\nIts main advantages are:\n• very fast operation,\n• extremely high endurance,\n• very low power consumption.\nIts main disadvantage is that reading is destructive.\nThe read operation changes the polarization, so after every read the stored information\nmust be written back into the memory cell."}, {"number": 15, "question": "Compare Flash, MRAM, ReRAM, and FeRAM.", "answer": "These four technologies all retain data without power but have different strengths.\n• Flash provides the highest storage density and the lowest cost, making it ideal for\nmass storage, but it has slow writes and limited endurance.\n• MRAM offers very fast access, extremely high endurance, and radiation resistance,\nbut it is relatively expensive.\n\n• ReRAM is highly scalable, fast, and suitable for future high-density memories,\nalthough resistance variability is still a challenge.\n• FeRAM provides exceptional endurance and very low power consumption, but\ndestructive reads and lower density limit its capacity.\nEach technology is therefore optimized for different applications rather than replacing all\nothers."}]}, {"title": "Lecture Speed of Combinational Circuits", "cards": [{"number": 1, "question": "Why does a CMOS inverter not switch instantaneously?", "answer": "A CMOS inverter cannot switch instantaneously because its output is connected to a\ncapacitance. This capacitance includes the input capacitance of the following logic gates\nand the capacitance of the metal interconnections.\nWhen the inverter output changes from high to low, the NMOS transistor must discharge\nthis capacitance. When the output changes from low to high, the PMOS transistor must\ncharge it.\nBoth transistors have a finite current-driving capability and an effective resistance.\nTherefore, charging or discharging the load requires a finite amount of time, producing\npropagation delay and finite rise and fall times."}, {"number": 2, "question": "Explain how the output of a CMOS inverter is discharged.", "answer": "Assume that the inverter output is initially at 𝑉𝐷𝐷 and its input changes rapidly from 0 to\n𝑉𝐷𝐷.\nThe PMOS transistor turns off, while the NMOS transistor turns on. The load capacitor then\ndischarges through the NMOS transistor
