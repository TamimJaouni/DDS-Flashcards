 toward ground.\nAt first, when the output voltage is high, the NMOS delivers an approximately constant and\nrelatively large current. Later, as the output voltage falls, the drain-source voltage becomes\nsmaller and the discharge current decreases.\n\nMost of the switching delay comes from this second region, where the transistor current\ndepends strongly on the decreasing output voltage."}, {"number": 3, "question": "Why can the first discharge region often be neglected?", "answer": "In the first region, the output voltage decreases from 𝑉𝐷𝐷 to approximately 𝑉𝐷𝐷−𝑉𝑡ℎ.\nThis region contributes relatively little to the total delay for three reasons:\n• Its voltage range is small compared with the complete logic swing.\n• The NMOS current is at its highest in this region.\n• Because the current is high, the capacitor passes through this region quickly.\nThe second region lasts longer because the transistor current decreases as the output\nvoltage approaches zero. Therefore, the second region dominates the inverter’s overall\nswitching delay."}, {"number": 4, "question": "What is the approximate switching-delay formula for an inverter?", "answer": "For discharge from approximately 100% to 5% of the original output voltage, the lecture\ngives the approximation\n𝑡delay ≈4𝑅on𝐶\nor equivalently,\n𝑡delay ≈\n4𝐶\n𝜇𝐶′𝑜𝑥(𝑊/𝐿)(𝑉𝐷𝐷−𝑉𝑡ℎ).\nThis expression shows that delay increases with the load capacitance 𝐶. It decreases when\ncarrier mobility, transistor width, supply voltage, or gate overdrive increase.\nA wider transistor therefore switches faster, but it also presents more input capacitance to\nthe previous stage."}, {"number": 5, "question": "Which parameters influence inverter switching speed?", "answer": "The main parameters are:\n• Load capacitance 𝐶: A larger capacitance requires more charge and increases\ndelay.\n• Carrier mobility 𝜇: Higher mobility allows more current and reduces delay.\n• Transistor ratio 𝑊/𝐿: A wider or shorter transistor has greater current-driving\ncapability.\n• Supply voltage 𝑉𝐷𝐷: A larger supply voltage increases the gate overdrive and\nreduces delay.\n• Threshold voltage 𝑉𝑡ℎ: A smaller threshold voltage increases the overdrive and\nreduces delay.\nHowever, many of these improvements involve trade-offs. For example, increasing\ntransistor width reduces its output resistance but increases the input capacitance seen by\nthe previous gate."}, {"number": 6, "question": "Why is the PMOS transistor usually wider than the NMOS transistor?", "answer": "Electron mobility in NMOS transistors is higher than hole mobility in PMOS transistors.\nTherefore, for equal transistor dimensions, the NMOS generally conducts more strongly\nthan the PMOS.\nThis would make the falling output transition faster than the rising transition.\nTo obtain approximately equal rise and fall times, the PMOS transistor is made wider. Its\nlarger 𝑊/𝐿 ratio compensates for the lower mobility of holes and increases its charging\ncurrent.\nThe exact width ratio depends on the fabrication technology and transistor parameters."}, {"number": 7, "question": "What contributes to the load capacitance of a logic gate?", "answer": "The load capacitance consists mainly of two contributions.\nThe first is the input capacitance of the following logic gates. MOS transistor gates\nbehave like capacitors because the gate is separated from the channel by a thin oxide\nlayer.\nThe second is the interconnect capacitance of the metal wires. Metal lines form\ncapacitances with nearby wires, the substrate, and other conductive layers.\nIn modern integrated circuits, interconnect capacitance can be a major part of the total\nload, especially for long wires and clock networks."}, {"number": 8, "question": "How do supply voltage and threshold voltage affect inverter delay?", "answer": "The delay is inversely related to the gate overdrive:\n𝑉𝑔𝑠𝑡= 𝑉𝐷𝐷−𝑉𝑡ℎ.\nIncreasing 𝑉𝐷𝐷 increases the overdrive, allowing the conducting transistor to supply more\ncurrent. This reduces switching time.\nReducing 𝑉𝑡ℎ has a similar effect and also speeds up switching. However, a lower threshold\nvoltage increases subthreshold leakage through the transistor that should be off.\nTherefore, reducing threshold voltage improves speed but increases static power\nconsumption. This is an important speed–power trade-off in CMOS design."}, {"number": 9, "question": "Why should a large capacitive load not be driven directly by a very small inverter?", "answer": "A small inverter has a high effective output resistance and limited current capability. When\nit drives a very large capacitance, charging and discharging take a long time.\nOne might instead connect a very large inverter directly to the source. However, the large\ninverter itself has a very large input capacitance, which becomes a heavy load for the\noriginal small source.\nThe best solution is therefore neither one small inverter nor one immediately enormous\ninverter. A gradually increasing chain of inverter sizes provides a better balance and\nreduces the total propagation delay."}, {"number": 10, "question": "What is the optimal inverter-chain principle?", "answer": "To drive a very large capacitive load efficiently, a cascade of progressively larger inverters is\nused.\nThe mathematical optimum occurs when every inverter is approximately\n𝑒≈2.718\ntimes larger than the previous stage. Under this condition, each stage has approximately\nthe same time constant.\nFor a load ratio 𝐾, the optimal number of stages is approximately\n𝑁= ln(𝐾).\nIn practical standard-cell libraries, exact factors of 𝑒 are inconvenient, so size ratios of\nabout 2 or 3 are commonly used."}, {"number": 11, "question": "Why do optimal inverter stages have equal stage effort?", "answer": "Each inverter sees the input capacitance of the following inverter. If one stage is much too\nsmall relative to the next, that stage becomes disproportionately slow.\nIf one stage is unnecessarily large, it creates excessive capacitance for the previous stage.\nThe total delay is minimized when the load increase is distributed evenly across the stages.\nMathematically, this means that all stage time constants are equal and that the width ratio\nbetween successive stages is constant.\nThe optimal constant ratio is 𝑒, although values near 2–3 are normally used in real layouts."}, {"number": 12, "question": "Why does a stable CMOS inverter consume almost no ideal static power?", "answer": "When the input is a stable 0, the PMOS is on and the NMOS is off. When the input is a stable\n1, the NMOS is on and the PMOS is off.\nIdeally, there is therefore no direct current path from 𝑉𝐷𝐷 to ground.\nReal CMOS circuits still consume some static power because of subthreshold leakage and\ngate-tunneling currents, but these are neglected in the ideal model.\nMost ideal CMOS power consumption occurs during switching, when the output\ncapacitance is charged or discharged."}, {"number": 13, "question": "Derive the dynamic power formula for a CMOS inverter.", "answer": "When the output capacitance is charged from 0 to 𝑉𝐷𝐷, the power supply provides the\ncharge\n\n𝑄= 𝐶𝑉𝐷𝐷.\nIf this happens once in every period at switching frequency 𝑓, the average current is\n𝐼avg = 𝑓𝐶𝑉𝐷𝐷.\nThe average power is then\n𝑃avg = 𝑉𝐷𝐷𝐼avg = 𝑓𝐶𝑉𝐷𝐷\n2 .\nMore generally, an activity factor 𝛼 is included:\n𝑃dynamic = 𝛼𝑓𝐶𝑉𝐷𝐷\n2 .\nThus, dynamic power depends linearly on capacitance and frequency but quadratically on\nsupply voltage."}, {"number": 14, "question": "Where does the energy go when a capacitor is charged and discharged?", "answer": "During charging, the source delivers energy equal to\n𝐶𝑉𝐷𝐷\n2 .\nOnly half of this energy,\n1\n2 𝐶𝑉𝐷𝐷\n2 ,\nis stored in the capacitor’s electric field. The other half is dissipated as heat in the\nconducting transistor.\nDuring discharge, the energy stored in the capacitor is also converted into heat in the\nNMOS transistor.\nTherefore, one complete charging and discharging cycle dissipates approximately 𝐶𝑉𝐷𝐷\n2 .\nThe result is independent of the transistor resistance: a lower resistance produces a larger\ncurrent for a shorter time, but the total dissipated energy remains the same."}, {"number": 15, "question": "What is adiabatic clocking, and how can it reduce power?", "answer": "Adiabatic clocking charges and discharges capacitances gradually rather than connecting\nthem suddenly to fixed supply voltages.\nThe goal is to keep the voltage difference across the switching transistor small. A smaller\nvoltage difference means less instantaneous power is dissipated in the transistor\nresistance.\nThe lecture first considers charging with an ideal current source. In this ideal case, the\nsource delivers exactly the energy stored in the capacitor, and the energy can be recovered\nduring discharge.\nA practical approximation uses one or more intermediate voltage levels. With 𝑁\nintermediate steps, the lecture states that power dissipation can ideally be reduced by a\nfactor of approximately 𝑁+ 1. The trade-offs are more complex clock generation, slower\ntransitions, and additional circuitry."}]}, {"title": "Lecture Static RAM (SRAM) and Dynamic RAM (DRAM)", "cards": [{"number": 1, "question": "What is the difference between volatile and non-volatile memory?", "answer": "Semiconductor memories are divided into volatile and non-volatile memories.\nVolatile memories store information as electrical voltages and require continuous power to\nretain data. If power is removed, all stored information is lost. The two most important\nvolatile memories are SRAM and DRAM.\nNon-volatile memories retain information even after power is removed. Examples include\nFlash memory, EEPROM, and other NVM technologies.\nBoth SRAM and DRAM are random-access memories, meaning every memory location can\nbe accessed in approximately the same time regardless of its physical position."}, {"number": 2, "question": "How is a semiconductor memory organized?", "answer": "A semiconductor memory consists of a large array of 1-bit memory cells arranged in rows\nand columns.\nEach row represents one memory word, while columns correspond to the bits within that\nword.\nAn address decoder activates exactly one row according to the input address. The selected\ncells connect to the bit lines, allowing the entire word to be read or written simultaneously.\nDuring writing, peripheral drivers force the desired voltages onto the bit lines. During\nreading, these drivers are disabled, allowing the selected cells to drive the bit lines. Sense\namplifiers may be used to detect small voltage differences."}, {"number": 3, "question": "What is SRAM, and why is it called \"static\"?", "answer": "SRAM stands for Static Random Access Memory.\nEach SRAM cell stores one bit using two cross-coupled CMOS inverters that form a bistable\nlatch with positive feedback. The cell normally contains six transistors (6T).\nIt is called static because the stored data remains unchanged as long as power is supplied.\nNo refresh operation is required.\nSRAM is extremely fast, has virtually unlimited write endurance, but its cells are relatively\nlarge, making SRAM expensive and low in storage density. Therefore, SRAM is mainly used\nfor CPU caches and other high-speed memories."}, {"number": 4, "question": "How does an SRAM cell store data?", "answer": "An SRAM cell stores information using two cross-coupled CMOS inverters connected in a\nfeedback loop.\nThis circuit has two stable operating points:\n\n• Q = 1, QN = 0\n• Q = 0, QN = 1\nOnce one of these states is established, the positive feedback continuously reinforces it.\nThe two additional access transistors connect the internal storage nodes to the bit lines\nwhenever the word line is activated.\nThus, the information is stored indefinitely while power is present."}, {"number": 5, "question": "Why does SRAM use two bit lines instead of one?", "answer": "SRAM stores both the signal Q and its complement QN.\nTherefore, it uses two bit lines:\n• Bit Line P\n• Bit Line N\nThis enables differential operation.\nDifferential sensing provides several advantages:\n• faster reading,\n• more reliable detection,\n• better noise immunity,\n• larger voltage difference for the sense amplifier.\nThe lecture also explains that two bit lines are necessary for reliable writing because one\nbit line alone cannot always overcome the strong positive feedback inside the SRAM cell."}, {"number": 6, "question": "Explain how data is written into an SRAM cell.", "answer": "Suppose the cell currently stores Q = 0 and we want to write Q = 1.\nThe peripheral write drivers set:\n• Bit Line P = 1\n• Bit Line N = 0\nThen the word line is activated.\nOne access transistor strongly pulls QN toward zero, overcoming the inverter that currently\nholds the old state.\nOnce QN crosses the inverter threshold, the positive feedback immediately switches the\nentire latch to the opposite stable state.\nThis rapid change is called cell flipping.\nAfter the new state is established, the word line is turned off and the cell stores the new\nvalue."}, {"number": 7, "question": "Why are two access transistors necessary for writing?", "answer": "Using only one access transistor would often fail.\nFor example, if we try to write a logic 1 through only the positive bit line, the access\ntransistor may conduct too weakly because of its gate-source voltage.\nMeanwhile, the inverter inside the SRAM cell still strongly pulls the storage node toward\nzero.\nAs a result, the internal feedback overpowers the write operation.\nThe second bit line actively drives the complementary storage node in the opposite\ndirection, allowing the latch to flip successfully.\nTherefore, two access transistors and two bit lines are required for robust write operation."}, {"number": 8, "question": "Why can an SRAM cell accidentally change state during reading?", "answer": "During reading, the bit lines have large capacitances.\nIf the bit lines happen to be charged to unfavorable voltages, current flows between the cell\nand the bit lines when the word line is activated.\nThis current may temporarily pull one of the storage nodes toward the inverter threshold.\nIf the voltage crosses that threshold, the cross-coupled inverters switch states and the\nstored information is accidentally overwritten.\nThis undesirable phenomenon is called read disturb or read upset."}, {"number": 9, "question": "How is the read-disturb problem solved in SRAM?", "answer": "Before reading, both bit lines are precharged, usually to logic 1.\nPrecharge transistors perform this operation.\nDuring reading, only one bit line is discharged slightly by the selected SRAM cell.\nSince the pull-down NMOS inside the cell is stronger than the access transistor, the\nstorage node remains stable while discharging the bit line.\nThis prevents the cell from flipping and allows reliable reading.\nMany SRAMs also use sense amplifiers to detect the small voltage difference quickly\nwithout disturbing the stored data."}, {"number": 10, "question": "Why are sense amplifiers used in SRAM?", "answer": "The voltage difference produced by the memory cell during reading is often very small.\nWaiting until the bit line reaches a full logic level would be slow because the bit-line\ncapacitance is large.\nInstead, a sense amplifier detects even a tiny voltage difference between the two bit lines\nand rapidly amplifies it into a full logic 0 or logic 1.\nThis significantly increases read speed while minimizing disturbance of the stored data."}, {"number": 11, "question": "What is DRAM, and how does it differ from SRAM?", "answer": "DRAM stands for Dynamic Random Access Memory.\nInstead of storing data in a bistable latch, DRAM stores information as electrical charge on\na capacitor.\nModern DRAM usually uses a 1-transistor, 1-capacitor (1T1C) cell.\nCompared with SRAM:\n• it is much smaller,\n• has much higher storage density,\n• costs less per bit,\n• is slightly slower,\n• requires periodic refresh.\nBecause of its high density, DRAM is used as the main memory in computers,\nsmartphones, and servers."}, {"number": 12, "question": "Why does DRAM require refresh?", "answer": "The capacitor inside a DRAM cell is not perfectly insulated.\n\nEven when the access transistor is off, leakage currents slowly discharge the stored\ncapacitor.\nWithout refreshing, the stored voltage gradually decreases until the stored information is\nlost.\nTherefore, every DRAM cell must be periodically read and rewritten before too much charge\ndisappears.\nThis refresh operation occurs automatically inside the memory controller and is usually\ninvisible to the user."}, {"number": 13, "question": "Explain how reading works in a 1T1C DRAM cell.", "answer": "Before reading, the bit line is precharged.\nWhen the access transistor is enabled, the capacitor shares its charge with the much larger\nbit-line capacitance.\nBecause the bit line has a much larger capacitance, its voltage changes only slightly—often\nby less than 100 mV.\nA very sensitive sense amplifier detects this small voltage difference and determines\nwhether the stored value was a logic 0 or logic 1.\nHowever, this charge-sharing process partially discharges the storage capacitor, making\nDRAM reads destructive."}, {"number": 14, "question": "What is DRAM refresh, and why is it necessary after every read?", "answer": "Reading a DRAM cell removes some of the charge stored on its capacitor because of\ncharge sharing with the bit line.\nAfter the sense amplifier detects the stored value, its output is connected back to the bit\nline.\n\nThis restores the capacitor to its original voltage.\nThis restoration process is called refresh.\nWithout refresh, every read operation would weaken the stored charge until the information\ndisappeared."}, {"number": 15, "question": "Compare SRAM and DRAM.", "answer": "The most important differences are:\nSRAM\nDRAM\nStores data in cross-coupled inverters Stores charge on a capacitor\nTypically 6 transistors per bit\nTypically 1 transistor + 1 capacitor\nNo refresh required\nPeriodic refresh required\nVery fast (≈0.5–2 ns)\nSlightly slower (≈1–10 ns)\nLow density\nHigh density\nExpensive per bit\nCheap per bit\nUsed for CPU cache\nUsed for main memory\n\nIn summary, SRAM maximizes speed, while DRAM maximizes storage density and\nminimizes cost. Modern computer systems therefore use both: SRAM for processor caches\nand DRAM for main memory."}]}, {"title": "Lecture 4 – Flip-Flops and Latches", "cards": [{"number": 1, "question": "What is the difference between a latch and a flip-flop?", "answer": "Both latches and flip-flops are memory elements used in sequential circuits, where the\noutput depends on both the current inputs and the previous state.\nThe key difference is how they are controlled:\n\n• A latch is level-sensitive. It responds whenever the control signal (Load or Enable)\nis active.\n• A flip-flop is edge-triggered. It changes its stored value only at a clock edge, usually\nthe rising edge.\nThis makes flip-flops much more predictable in synchronous digital systems because the\noutput changes only at well-defined clock instants."}, {"number": 2, "question": "How does a D-latch work?", "answer": "A D-latch stores one bit of information.\nWhen Load = 1, the latch is transparent, meaning the output continuously follows the\ninput D.\nWhen Load = 0, the input is disconnected and the latch keeps the last stored value.\nTherefore:\n• Load = 1 → Output follows D.\n• Load = 0 → Previous value is preserved.\nThis makes the latch suitable for temporary storage, although it is sensitive to input\nchanges while enabled."}, {"number": 3, "question": "What does it mean that a latch is transparent?", "answer": "A transparent latch means there is a direct connection between the input and output while\nthe load signal is active.\nAs long as Load = 1, every change on the input immediately appears at the output.\nOnce Load becomes 0, the connection is broken, and the output remains constant even if\nthe input changes.\nThe lecture explains this using the analogy of a canal lock with one gate: when the gate is\nopen, water flows freely; when it closes, the water level is trapped and stored."}, {"number": 4, "question": "How does a D flip-flop work?", "answer": "A D flip-flop consists of two latches connected in series, called the master and slave\nlatches.\nThe master latch is active during one clock phase, while the slave latch is active during the\nopposite phase.\nAs a result, the input D is sampled only at the rising edge of the clock.\nAfter that edge, changes on D no longer affect the output until the next rising edge.\nThis edge-triggered behavior makes flip-flops ideal for synchronous digital systems\nbecause all state changes occur simultaneously with the clock."}, {"number": 5, "question": "Why is a master-slave structure used?", "answer": "Using two latches prevents the output from continuously following the input.\nThe first latch captures the input during one clock phase.\nThe second latch transfers that stored value to the output during the opposite clock phase.\nSince only one latch is transparent at a time, the output changes only on the clock edge\ninstead of continuously.\nThis converts a level-sensitive latch into an edge-triggered flip-flop."}, {"number": 6, "question": "Why must both latches never be transparent simultaneously?", "answer": "If both latches became transparent simultaneously, the input could pass directly through\nboth stages.\nThe flip-flop would behave like a latch instead of an edge-triggered storage element.\nThe lecture shows that slow clock transitions may temporarily make both latches\ntransparent, allowing unwanted changes to reach the output.\nTo prevent this, the clock signals are carefully generated inside the flip-flop using dedicated\nclock inverters."}, {"number": 7, "question": "What is the disadvantage of a dynamic memory cell?", "answer": "A dynamic memory cell stores information as charge on a capacitor.\nUnfortunately, capacitors slowly discharge due to leakage currents.\nTherefore, the stored value disappears after some time if it is not refreshed.\nDynamic cells are therefore unsuitable for long-term storage unless they are periodically\nrewritten.\nThis drawback motivated the development of static memory cells based on positive\nfeedback."}, {"number": 8, "question": "How does a static memory cell work?", "answer": "A static memory cell consists of two inverters connected in a feedback loop.\n\nThe feedback creates two stable operating points:\n• Logic 0\n• Logic 1\nOnce the circuit reaches either stable state, positive feedback keeps it there indefinitely\nwhile power is supplied.\nUnlike dynamic memory, no refresh is required.\nThis principle is the basis of SRAM cells and CMOS latches."}, {"number": 9, "question": "Why is one operating point unstable?", "answer": "The feedback circuit has three theoretical operating points.\nTwo correspond to logic 0 and logic 1 and are stable.\nThe third occurs near VDD/2, where the input equals the output.\nAny tiny disturbance, such as electrical noise, pushes the circuit away from this point.\nPositive feedback amplifies the disturbance until the circuit settles into one of the two\nstable logic states.\nTherefore, the middle operating point is unstable."}, {"number": 10, "question": "How can a latch be implemented using a multiplexer?", "answer": "A multiplexer can be used as the storage element.\nWhen Load = 1, the multiplexer selects the external input D.\nThe latch is transparent, and the output follows D.\nWhen Load = 0, the multiplexer selects its own output through a feedback path.\n\nThis feedback continuously re-applies the stored value to the input, allowing the latch to\nremember its state.\nThis is one practical CMOS implementation of a latch."}, {"number": 11, "question": "Why do flip-flops use an asynchronous reset?", "answer": "Immediately after power-up, a flip-flop has an unknown logic state.\nThis uncertainty can cause incorrect system behavior.\nAn asynchronous reset forces the output to a known state regardless of the clock.\nAs soon as Reset becomes active, the output becomes zero independently of D and the\nclock.\nThis guarantees reliable initialization before normal operation begins."}, {"number": 12, "question": "Why are output buffers added to a flip-flop?", "answer": "The internal storage node of a flip-flop is sensitive.\nIf another circuit accidentally drives that node, the stored value could be overwritten.\nAdding an output inverter or buffer isolates the storage node from external circuits.\nThe buffer also generates both Q and Q̅ outputs while protecting the internal memory cell\nfrom unwanted interference."}, {"number": 13, "question": "Why are internal clock inverters integrated into the flip-flop?", "answer": "Large digital systems may contain thousands of flip-flops.\nIf one external inverter drives all of them, the heavy capacitive load slows the clock edges.\nSlow clock transitions increase the risk that both latches become transparent\nsimultaneously.\nTo prevent this, each flip-flop contains its own small clock inverters, producing fast local\nclock signals with proper timing."}, {"number": 14, "question": "Compare dynamic and static flip-flops.", "answer": "Dynamic flip-flops:\n• store charge on capacitors,\n• require periodic clock activity,\n• use fewer transistors,\n• occupy less chip area,\n• are faster and smaller.\nStatic flip-flops:\n• use positive feedback,\n• retain data indefinitely while power is supplied,\n• require more transistors,\n• are more reliable,\n• are the standard choice in most CMOS digital systems.\nDynamic flip-flops are mainly used when minimizing area and transistor count is critical."}, {"number": 15, "question": "What are the advantages of a dual-edge-triggered flip-flop?", "answer": "A conventional flip-flop captures data only on the rising edge of the clock.\nA dual-edge-triggered flip-flop captures data on both the rising and falling edges.\nIt uses two latches operating alternately and a multiplexer that selects the correct stored\nvalue.\nThis allows the circuit to transfer twice as much information at the same clock frequency or\nachieve the same throughput with a lower clock frequency.\nAs a result, dual-edge-triggered flip-flops improve energy efficiency while maintaining\nperformance."}]}, {"title": "Lecture 3 – Combinational Logic", "cards": [{"number": 1, "question": "What is combinational logic?", "answer": "Combinational logic is a type of digital circuit whose outputs depend only on the current\ninput values. Unlike sequential circuits, combinational circuits have no memory, so\nprevious input values do not influence the output.\nEvery Boolean function can be expressed using combinations of AND, OR, and NOT gates.\nSince larger gates can be built from two-input gates, any combinational function can\nultimately be implemented using two-input logic gates and inverters. This set of gates\nforms the fundamental basis of Boolean algebra."}, {"number": 2, "question": "What are logic constants and how are they implemented?", "answer": "The simplest Boolean functions are the constants 0 and 1.\n• Logic 0 corresponds to GND.\n\n• Logic 1 corresponds to VDD.\nIn integrated circuits, these constants are usually implemented using dedicated standard\ncells rather than directly shorting wires to the power rails. This helps avoid manufacturing\nproblems such as the antenna effect."}, {"number": 3, "question": "What is a standard cell and why is it important?", "answer": "A standard cell is a pre-designed and verified building block used in ASIC design.\nExamples include:\n• AND gates\n• OR gates\n• Inverters\n• Flip-flops\nStandard cells have fixed height but variable width, allowing automated placement and\nrouting.\nTheir advantages include:\n• faster chip design,\n• automated synthesis,\n• optimized timing,\n• reduced power consumption,\n• reliable layouts.\nModern digital chips such as CPUs and SoCs are almost entirely built from standard-cell\nlibraries."}, {"number": 4, "question": "What is the antenna effect?", "answer": "The antenna effect is a manufacturing problem during IC fabrication.\nLong metal wires can accumulate electrical charge during plasma processing.\nIf this charge is connected to a transistor gate before a discharge path exists, the gate oxide\nmay be damaged.\nTo prevent this, designers use:\n• antenna design rules,\n• protection diodes,\n• shorter metal connections,\n• layer hopping,\n• routing modifications.\nEDA tools automatically check layouts for antenna rule violations."}, {"number": 5, "question": "How many Boolean functions exist for two variables?", "answer": "For n variables, the number of Boolean functions is:\n22𝑛\nFor two variables:\n222 = 24 = 16\nThese sixteen functions include:\n• constants,\n• identity,\n• inversion,\n• AND,\n\n• OR,\n• NAND,\n• NOR,\n• XOR,\n• XNOR,\n• implication,\n• inhibition,\n• and several others.\nThe lecture explains how all sixteen can be generated systematically from truth tables."}, {"number": 6, "question": "Why are NAND and NOR called universal gates?", "answer": "A universal gate is one that can implement every Boolean function by itself.\nNAND is universal because:\n• NOT can be created by connecting both inputs together.\n• AND is obtained by inverting NAND.\n• OR is obtained using De Morgan's laws.\nSince AND, OR, and NOT form a complete Boolean basis, NAND alone can realize every\nlogic function.\nThe same idea also applies to NOR."}, {"number": 7, "question": "Explain De Morgan's laws.", "answer": "De Morgan's laws allow transformations between AND and OR operations.\n\nThe two laws are:\n• NOT(A OR B) = NOT A AND NOT B\n• NOT(A AND B) = NOT A OR NOT B\nThese identities are extremely useful because they allow circuits built from AND and OR\ngates to be converted into NAND-only or NOR-only implementations.\nThey are heavily used in CMOS design and logic optimization."}, {"number": 8, "question": "Why can every Boolean function be implemented using only NAND gates?", "answer": "First, every Boolean function can be written using AND, OR and NOT.\nNext,\n• NOT is implemented using one NAND.\n• AND is NAND followed by an inverter.\n• OR is obtained using De Morgan's law and NAND gates.\nTherefore every logical operation can be replaced by NAND gates.\nThis makes NAND the fundamental building block in many integrated circuit libraries\nbecause manufacturing only one gate type simplifies chip production."}, {"number": 9, "question": "What are the basic rules for constructing CMOS logic gates?", "answer": "A CMOS gate consists of two complementary transistor networks:\n• an NMOS pull-down network,\n• a PMOS pull-up network.\n\nThe design rules are:\n• NMOS conducts when the output should become 0.\n• PMOS conducts when the output should become 1.\n• They must never conduct simultaneously because that creates cross current.\n• They must never both be OFF because then the output floats and becomes\nundefined.\nThese rules ensure correct logic levels with very low static power consumption."}, {"number": 10, "question": "How do you construct the NMOS network from a truth table?", "answer": "The NMOS network is built directly from the rows where the output equals zero.\nFor each such row:\n• construct one series path of NMOS transistors,\n• invert every input that is zero in that row,\n• connect all these series paths in parallel.\nThe resulting network conducts exactly for the input combinations that should pull the\noutput to ground.\nThe PMOS network is then built as the dual complementary network."}, {"number": 11, "question": "What is a multiplexer and how does it work?", "answer": "A 2-to-1 multiplexer has:\n• two data inputs (X0 and X1),\n\n• one select input,\n• one output.\nIf Sel = 0, the output equals X0.\nIf Sel = 1, the output equals X1.\nIn Verilog this is written as:\nY= sel ? X1 : X0;\nIts Boolean equation is\n𝑌= (𝑆𝑒𝑙⋅𝑋0) + (𝑆𝑒𝑙⋅𝑋1)\nThe multiplexer is one of the most important building blocks in digital systems."}, {"number": 12, "question": "Why is the multiplexer considered such an important circuit?", "answer": "The multiplexer is extremely versatile because every Boolean function can be implemented\nusing only multiplexers and logical constants.\nThis idea forms the basis of Binary Decision Diagrams (BDDs), where logic functions are\nrepresented as decision trees built entirely from multiplexers.\nThe lecture also demonstrates how NOT, AND, and XNOR can all be implemented with a\nsingle multiplexer."}, {"number": 13, "question": "What is a gated inverter?", "answer": "A gated inverter is an inverter with an additional Enable input.\nWhen Enable = 1, it behaves like a normal inverter.\nWhen Enable = 0, the output enters the high-impedance (High-Z) state.\n\nIn the High-Z state, the output is disconnected from both VDD and GND.\nThis allows several outputs to share one wire safely, provided that only one gated inverter is\nenabled at a time."}, {"number": 14, "question": "Why can't ordinary logic gate outputs be connected together?", "answer": "Ordinary CMOS outputs actively drive either logic 0 or logic 1.\nIf two outputs are shorted together while driving opposite values,\n• one transistor network pulls the wire toward VDD,\n• the other pulls it toward GND.\nThis creates a large cross current, wastes power, generates heat, and may damage the\ncircuit.\nGated inverters avoid this problem because inactive outputs enter the High-Z state instead\nof driving the wire."}, {"number": 15, "question": "How can a multiplexer be implemented using gated inverters?", "answer": "Instead of implementing the multiplexer directly from Boolean equations, two gated\ninverters can be used.\nOnly one gated inverter is enabled at any time.\nIts output drives the shared connection, while the other inverter remains in the High-Z\nstate.\nThis implementation requires:\n• two normal inverters,\n\n• two gated inverters.\nThe lecture also presents an optimized version using incomplete gated inverters that\nreduces the transistor count from 14 transistors to 12, making the circuit smaller and\nmore efficient."}, {"number": 16, "question": "Explain the CMOS transistor implementation of a NOR gate.", "answer": "A CMOS NOR gate consists of two complementary transistor networks:\n• a PMOS pull-up network connected to VDD,\n• an NMOS pull-down network connected to GND.\nThe output of a NOR gate is\n𝑌= 𝐴+ 𝐵.\nThe output should be 1 only when both inputs are 0.\nPMOS network\nPMOS transistors conduct when their gate input is 0.\nSince both inputs must be 0 to obtain an output of 1, both PMOS transistors must\nconduct simultaneously.\nTherefore, the PMOS transistors are connected in series.\nOnly when both conduct is there a path from VDD to the output.\nNMOS network\nThe output should become 0 whenever A = 1 or B = 1.\nTherefore, if either NMOS transistor turns on, the output must be connected to ground.\nFor this reason, the NMOS transistors are connected in parallel.\nSummary\nFor a CMOS NOR gate:\n• PMOS: series connection\n• NMOS: parallel connection\n\nThis arrangement guarantees that:\n• only one network conducts at a time,\n• there is never a direct path from VDD to GND,\n• the output is never left floating.\nThe lecture also shows that the initial implementation can often be simplified using\nBoolean absorption rules, reducing the number of required transistors and connections."}, {"number": 17, "question": "Explain the CMOS transistor implementation of a NAND gate.", "answer": "A CMOS NAND gate also consists of complementary PMOS and NMOS networks.\nIts Boolean function is\n𝑌= 𝐴⋅𝐵.\nThe output is 0 only when both inputs are 1.\nNMOS network\nNMOS transistors conduct for logic 1.\nTo pull the output to ground, both A and B must be equal to 1.\nTherefore, both NMOS transistors must conduct simultaneously.\nFor this reason, the NMOS transistors are connected in series.\nOnly when both are on is there a conducting path to GND.\nPMOS network\nThe output should be 1 whenever at least one input is 0.\nPMOS transistors conduct for logic 0.\nTherefore, if either PMOS transistor conducts, the output should be connected to VDD.\nTo achieve this, the PMOS transistors are connected in parallel.\n\nSummary\nFor a CMOS NAND gate:\n• PMOS: parallel connection\n• NMOS: series connection\nCompared with the NOR gate, the transistor connections are exactly reversed.\nA useful rule to remember is:\n• Series NMOS → NAND\n• Parallel NMOS → NOR\n• Series PMOS → NOR\n• Parallel PMOS → NAND\nThis complementary structure ensures correct logic operation while avoiding both short\ncircuits and floating outputs."}]}, {"title": "Lecture 2 – CMOS Technology Basics and CMOS Inverter", "cards": [{"number": 1, "question": "What is CMOS technology, and why is it used in digital circuits?", "answer": "CMOS stands for Complementary Metal-Oxide-Semiconductor technology. It combines\nNMOS and PMOS transistors on the same silicon chip.\nIt was invented in 1963 by Frank Wanlass and Chih-Tang Sah and has become the\ndominant technology for modern digital integrated circuits.\nThe main reason CMOS is so successful is that NMOS and PMOS transistors complement\neach other. During steady-state operation, only one transistor conducts, so almost no\ndirect current flows from the power supply to ground. This results in very low static power\nconsumption.\nCMOS circuits are also compact, fast, highly reliable, and can integrate billions of\ntransistors on a single chip, making them ideal for processors, memories, and digital\nsystems."}, {"number": 2, "question": "Explain the structure of an NMOS transistor.", "answer": "An NMOS transistor consists of four terminals:\n• Source\n• Drain\n• Gate\n• Bulk (substrate)\nThe source and drain are n-doped, while the substrate is p-doped.\nThe gate is separated from the silicon by a very thin insulating silicon dioxide layer.\nWhen the gate-source voltage exceeds the threshold voltage, electrons are attracted\nbeneath the gate oxide and form a conducting channel between source and drain.\nThe transistor then behaves like a controllable electronic switch.\nTypical threshold voltages are between 0.3 V and 0.5 V."}, {"number": 3, "question": "Under what conditions does an NMOS transistor conduct?", "answer": "An NMOS transistor conducts when\n𝑉𝐺𝑆> 𝑉𝑡ℎ\nwhere:\n• 𝑉𝐺𝑆 is the gate-source voltage,\n• 𝑉𝑡ℎ is the threshold voltage.\nWhen this condition is satisfied, electrons accumulate beneath the gate oxide and create a\nconducting channel between source and drain.\nIf 𝑉𝐺𝑆 is below the threshold voltage, no conducting channel exists, and the transistor\nremains OFF.\n\nTherefore, the NMOS transistor is controlled entirely by the gate-source voltage."}, {"number": 4, "question": "Explain the structure and operation of a PMOS transistor.", "answer": "A PMOS transistor is complementary to an NMOS transistor.\nIts source and drain are p-doped, while the substrate is n-doped.\nInstead of electrons, the charge carriers are holes.\nA PMOS conducts when the gate voltage is sufficiently lower than the source voltage:\n𝑉𝐺𝑆< −|𝑉𝑡ℎ|\nThe electric field attracts holes to the oxide interface, creating a conducting channel.\nIn a PMOS transistor, the source is always the terminal with the highest potential, which\nis usually connected to VDD."}, {"number": 5, "question": "How do we determine which terminal is the source and which is the drain?", "answer": "Although MOS transistor symbols appear symmetric, the source is determined by voltage.\nFor an NMOS, the source is the terminal with the lower potential.\nFor a PMOS, the source is the terminal with the higher potential.\nThis definition follows the physical operating principle because the gate-source voltage\ndetermines whether the transistor conducts.\nTherefore, the source is identified from the operating voltages rather than from the physical\nlayout alone."}, {"number": 6, "question": "What is RTL (Resistor-Transistor Logic), and what are its disadvantages?", "answer": "RTL is an older logic family that combines a transistor with a resistor.\nExamples include:\n• NMOS transistor with a pull-up resistor,\n• PMOS transistor with a pull-down resistor.\nRTL has three major disadvantages:\n1. Continuous DC current flows whenever the transistor is ON, causing static power\nconsumption.\n2. Large resistors occupy significant chip area.\n3. Large resistor values together with output capacitance create large RC time\nconstants, making RTL circuits slow.\nThese disadvantages motivated the transition to CMOS technology."}, {"number": 7, "question": "How is a CMOS inverter constructed?", "answer": "A CMOS inverter consists of:\n• one PMOS transistor connected to VDD,\n• one NMOS transistor connected to GND.\nTheir gates are connected together to form the input.\nTheir drains are connected together to form the output.\nWhen the input is LOW:\n• PMOS conducts,\n• NMOS is OFF,\n\n• output becomes HIGH.\nWhen the input is HIGH:\n• NMOS conducts,\n• PMOS is OFF,\n• output becomes LOW.\nThus, the output is always the logical inverse of the input."}, {"number": 8, "question": "Why is the CMOS inverter superior to RTL?", "answer": "The CMOS inverter has several important advantages.\nFirst, during steady-state operation only one transistor conducts, so there is almost no DC\ncurrent flowing from VDD to GND.\nSecond, CMOS uses only transistors, eliminating the need for large resistors and reducing\nchip area.\nFinally, charging and discharging the output depends only on the conducting transistor and\nthe load capacitance, making CMOS circuits much faster than resistor-based logic.\nThese advantages explain why CMOS replaced RTL in modern integrated circuits."}, {"number": 9, "question": "Why is a MOS transistor often described as a voltage-controlled resistor?", "answer": "The resistance between source and drain depends on the gate voltage.\nA larger gate-source voltage creates more charge carriers in the channel.\nThis increases conductivity and decreases resistance.\nAs the drain-source voltage increases, however, the channel becomes less conductive\nnear the drain because the local gate-channel voltage decreases.\n\nEventually the channel pinches off, and the transistor enters saturation.\nThus, the transistor behaves approximately like a resistor whose value depends on both\ngate voltage and drain voltage."}, {"number": 10, "question": "What is transistor saturation?", "answer": "A transistor enters saturation when\n𝑉𝐷𝑆≥𝑉𝐺𝑆−𝑉𝑡ℎ.\nAt this point the conducting channel becomes pinched off near the drain.\nFurther increases in drain voltage no longer significantly increase the drain current.\nInstead, the current depends mainly on the gate-source voltage.\nIn digital circuits saturation mainly affects switching speed, while in analog electronics it is\nwidely used for amplifier design."}, {"number": 11, "question": "Which parameters determine the current of a MOS transistor?", "answer": "The transistor current depends mainly on:\n• Carrier mobility (μ) — higher mobility allows higher current.\n• Oxide capacitance (C′ox) — determines how much charge is induced in the\nchannel.\n• Transistor geometry (W/L) — wider transistors conduct more current, while longer\nchannels conduct less.\n• Gate overdrive (VGS − Vth) — larger overdrive creates more charge carriers.\nIncreasing the width-to-length ratio (W/L) is therefore one of the most common methods\nfor increasing transistor strength."}, {"number": 12, "question": "Why is the PMOS transistor usually wider than the NMOS transistor?", "answer": "Electrons move through silicon more easily than holes.\nTherefore, electron mobility in an NMOS transistor is approximately twice the hole\nmobility in a PMOS transistor.\nIf both transistors had identical dimensions, the NMOS would conduct much more\nstrongly.\nTo balance the charging and discharging speeds of the inverter, the PMOS transistor is\nusually designed with approximately twice the W/L ratio of the NMOS transistor.\nThis produces nearly symmetric switching characteristics."}, {"number": 13, "question": "Explain the transfer characteristic of a CMOS inverter.", "answer": "The transfer characteristic describes the relationship between the input voltage and the\noutput voltage.\nThree operating regions exist:\n• Low input voltage: NMOS is OFF, PMOS is ON, output equals VDD.\n• High input voltage: PMOS is OFF, NMOS is ON, output equals GND.\n• Intermediate voltages: both transistors conduct simultaneously.\nThe output voltage is determined by the operating point where the NMOS and PMOS\ncurrents are equal.\nThe transition between logic 1 and logic 0 is very steep, which is essential for reliable digital\noperation."}, {"number": 14, "question": "Why is the inverter transfer characteristic intentionally nonlinear?", "answer": "A nonlinear transfer characteristic creates a sharp transition between logic 0 and logic 1.\nThis provides noise margins.\nFor example:\n• voltages below approximately 𝑉𝑡ℎ are interpreted as logic 0,\n• voltages above approximately 𝑉𝐷𝐷−𝑉𝑡ℎ are interpreted as logic 1.\nSmall disturbances or electrical noise do not change the logical interpretation.\nWithout this nonlinearity, even small voltage fluctuations could produce incorrect logic\nvalues."}, {"number": 15, "question": "Explain the physical layout of a CMOS inverter.", "answer": "The physical layout is the two-dimensional representation used to manufacture the\ninverter.\nThe NMOS transistor is fabricated inside a P-type substrate or P-well, while the PMOS\ntransistor is placed inside an N-well.\nThe layout contains:\n• diffusion regions,\n• polysilicon gates,\n• contact holes,\n• metal interconnections,\n• well structures.\n\nTo allow automatic placement in standard-cell libraries, all cells have the same height,\naligned VDD and GND rails, and accessible input and output pins. This regular structure\nenables synthesis tools to place thousands or millions of inverters efficiently during chip\ndesign."}]}, {"title": "Lecture 1 – Introduction to Digital Circuit Design", "cards": [{"number": 1, "question": "What is the difference between analog and digital signals?", "answer": "An analog signal is continuous in both time and amplitude. It directly represents the\nphysical quantity being measured. For example, the voltage produced by a microphone\nchanges continuously according to the sound pressure.\nA digital signal represents information using discrete values, usually the binary digits 0 and\n1. To convert an analog signal into a digital one, the signal is sampled at discrete time\nintervals and each sample is represented by a binary number.\nThe main advantage of digital signals is that the information is encoded rather than directly\nrepresented by the voltage itself."}, {"number": 2, "question": "Why are digital systems more robust against noise than analog systems?", "answer": "In analog systems, every voltage value carries information. Therefore, any electrical noise\nchanges the signal itself and introduces distortion.\nIn digital systems, information is represented only by two voltage ranges corresponding to\nlogic 0 and logic 1.\nAs long as the noisy signal does not cross the decision threshold, the receiver still\ninterprets the correct logical value.\nThis property makes digital systems much more reliable in noisy environments and is one\nof the main reasons why modern electronic systems are almost entirely digital."}, {"number": 3, "question": "How are logic 0 and logic 1 represented electrically?", "answer": "In CMOS technology:\n• Logic 0 corresponds to ground potential (GND).\n• Logic 1 corresponds to the positive supply voltage (VDD).\nThe exact value of VDD depends on the technology. Modern integrated circuits often\noperate around 1 V, while older systems used higher voltages.\nThus, digital information is represented by voltage levels rather than by continuously\nvarying signals."}, {"number": 4, "question": "What is Boolean algebra, and why is it important?", "answer": "Boolean algebra is the mathematical foundation of digital electronics.\nUnlike ordinary algebra, Boolean variables can take only two values:\n• 0 (false)\n• 1 (true)\nIts basic operations are:\n• AND,\n• OR,\n• NOT.\nBoolean algebra allows engineers to describe, analyze, simplify, and optimize digital\ncircuits before implementing them with logic gates.\nIt is often described as the language of digital electronics, while logic gates are the\nhardware that implements this language."}, {"number": 5, "question": "What are De Morgan's laws, and why are they useful?", "answer": "De Morgan's laws are two fundamental identities of Boolean algebra:\n• NOT(A AND B) = NOT A OR NOT B\n• NOT(A OR B) = NOT A AND NOT B\nThese laws allow AND functions to be transformed into OR functions and vice versa.\nThey are extremely important because they simplify logic expressions and make CMOS\nimplementations easier.\nThe lecture also illustrates De Morgan's laws graphically using both logic gates and set\ntheory."}, {"number": 6, "question": "Define the AND and OR functions.", "answer": "The AND function produces a logic 1 only if all inputs are 1.\nFor two variables:\n• 1 AND 1 = 1\n• all other combinations produce 0.\nThe OR function produces logic 1 whenever at least one input is 1.\nOnly when every input is 0 does the OR output become 0.\nThese two functions, together with NOT, form the basic operations of Boolean algebra."}, {"number": 7, "question": "What are NAND and NOR gates?", "answer": "A NAND gate is the negation of the AND function:\n𝑌= 𝐴⋅𝐵\nIt outputs 0 only when both inputs are 1.\nA NOR gate is the negation of the OR function:\n𝑌= 𝐴+ 𝐵\nIt outputs 1 only when both inputs are 0.\nBoth NAND and NOR are called universal gates, because every Boolean function can\nultimately be implemented using only NAND gates or only NOR gates."}, {"number": 8, "question": "How can logic functions be implemented using switches?", "answer": "A switch is controlled by an input voltage.\nWhen the input is logic 1, the switch closes and conducts.\nWhen the input is logic 0, it opens.\nBy connecting switches in series or parallel, logic functions such as AND and OR can be\nrealized.\nHowever, the switch network alone produces only a conducting or non-conducting path.\nTo generate a valid voltage output, the network must be connected to ground and a pull-up\nresistor connected to VDD."}, {"number": 9, "question": "Explain how a NAND gate can be implemented using switches.", "answer": "The NAND implementation uses:\n• two switches connected in series,\n• one pull-up resistor connected to VDD.\nIf both inputs are 1, both switches close, creating a path to ground.\nThe output therefore becomes logic 0.\nIf either switch is open, the path to ground is broken.\nThe pull-up resistor then pulls the output to VDD, producing logic 1.\nThus the circuit realizes the NAND function."}, {"number": 10, "question": "What is fan-out, and why can it become a problem?", "answer": "Fan-out means one output drives several inputs simultaneously.\nAlthough copying a logical signal is mathematically simple, every connected input adds\ncapacitance.\nAs the capacitive load increases, the output charges and discharges more slowly.\nThis increases signal delay and especially slows the rising edge.\nTo solve this problem, buffer gates are inserted to strengthen the signal and drive larger\nloads efficiently."}, {"number": 11, "question": "What are canonical forms of Boolean functions?", "answer": "Every Boolean function can be represented uniquely in two canonical forms:\n\n• Sum of Products (SOP) — OR of minterms.\n• Product of Sums (POS) — AND of maxterms.\nThe SOP form includes only the input combinations where the output equals 1.\nThe POS form includes only the combinations where the output equals 0.\nThese canonical forms provide a systematic way to implement any logic function directly\nfrom its truth table."}, {"number": 12, "question": "What is a minterm?", "answer": "A minterm is an AND combination of all input variables, where each variable appears\neither in its normal or complemented form.\nA minterm evaluates to 1 for exactly one input combination.\nTo construct an SOP expression:\n1. Find every row of the truth table where the output is 1.\n2. Construct one minterm for each of those rows.\n3. OR all the minterms together.\nThis produces a Boolean function that exactly matches the truth table."}, {"number": 13, "question": "Why are canonical forms usually simplified?", "answer": "Canonical forms always produce the correct logic function, but they often require many\ngates.\nFor example, the lecture's 8-bit comparator implemented in canonical form requires:\n• 256 sixteen-input AND gates,\n• one 256-input OR gate.\n\nThis implementation is correct but inefficient.\nTherefore, Boolean algebra identities or Karnaugh maps are used to reduce the number of\ngates, making the circuit smaller, faster, and cheaper."}, {"number": 14, "question": "How can an equality comparator be implemented more efficiently?", "answer": "Instead of using the canonical normal form, each pair of corresponding bits can be\ncompared individually.\nFor one bit, equality is expressed by the XNOR function:\n𝑌= (𝐴⋅𝐵) + (𝐴⋅𝐵)\nThis produces 1 whenever both bits are equal.\nFor an 8-bit comparator, eight XNOR gates compare the corresponding bit pairs.\nThe outputs of all XNOR gates are then combined with an AND gate.\nIf every pair of bits is equal, the final output equals 1.\nThis implementation is much simpler than the canonical form."}, {"number": 15, "question": "What is the difference between combinational and sequential circuits?", "answer": "A combinational circuit has no memory.\nIts outputs depend only on the current input values.\nExamples include logic gates, adders, multiplexers, and comparators.\nA sequential circuit contains memory elements.\nIts outputs depend on both the current inputs and the previous state of the system.\n\nExamples include counters, registers, state machines, and timers.\nThe lecture uses an alarm clock as an example. A state machine starts a counter, the\ncounter increments on every clock cycle, and a comparator detects when the preset time\nhas been reached. Registers built from flip-flops store the counter value and update it only\non the rising edge of the clock."}]}, {"title": "Lecture 3 – Part 2 (Multiplexers, Decoders, Demultiplexers, Encoders, and FPGA Lookup Tables)", "cards": [{"number": 1, "question": "What is an n-to-1 multiplexer?", "answer": "An n-to-1 multiplexer (MUX) is a combinational circuit that selects one of many input\nsignals and forwards it to a single output.\nUnlike the 2-to-1 multiplexer discussed earlier, an n-to-1 multiplexer can choose between\nmany input channels.\nThe selection is controlled by a binary select signal. For example, a 4-to-1 multiplexer has\ntwo select bits:\n• Sel = 00 → X0 is selected.\n• Sel = 01 → X1 is selected.\n• Sel = 10 → X2 is selected.\n• Sel = 11 → X3 is selected.\nInternally, only the selected input is connected to the output, while all other channels\nremain in the high-impedance (High-Z) state."}, {"number": 2, "question": "Why is a decoder needed in a multiplexer?", "answer": "The select input of a multiplexer is a binary number.\n\nHowever, each input channel requires its own individual enable signal.\nA decoder converts the binary select input into a one-hot code, where exactly one output\nis active.\nFor example, if the select input represents the decimal number 9, only output Y9 becomes\n1, while all other outputs remain 0.\nThese enable signals activate only the gated inverter corresponding to the selected\nchannel."}, {"number": 3, "question": "What is a decoder?", "answer": "A decoder is a combinational circuit that converts an n-bit binary input into 2ⁿ output\nlines.\nExactly one output becomes active, corresponding to the binary value of the input.\nFor example, an 8-bit decoder has:\n• 8 input bits,\n• 256 output lines.\nIf the binary input equals the decimal number 9, only output Y9 becomes logic 1.\nAll remaining outputs stay at logic 0.\nTherefore, a decoder transforms binary information into one-hot encoded signals."}, {"number": 4, "question": "How is a decoder implemented?", "answer": "Each output of the decoder is implemented using one large AND gate.\nEvery input variable appears once:\n• in normal form if that bit is 1,\n• in complemented form if that bit is 0.\n\nFor example,\n𝑌9 = 𝐷7 𝐷6 𝐷5 𝐷4 𝐷3 𝐷2 𝐷1 𝐷0\nThis expression becomes 1 only for the binary number 9.\nAn 8-bit decoder therefore requires:\n• 256 eight-input AND gates,\n• 8 inverters,\nresulting in approximately 4600 transistors."}, {"number": 5, "question": "How is a large multiplexer implemented using a decoder?", "answer": "A decoder generates one enable signal for every input channel.\nEach enable controls one gated inverter.\nOnly the enabled gated inverter connects its input to the output.\nFor a 256-to-1 multiplexer, this requires:\n• one decoder,\n• 256 gated inverters,\n• one output inverter.\nThe lecture estimates that this implementation requires approximately 6100 transistors."}, {"number": 6, "question": "What is the difference between a digital and an analog multiplexer?", "answer": "A digital multiplexer transfers only digital logic levels (0 or 1).\n\nIts outputs actively drive the selected logic signal.\nAn analog multiplexer behaves like an electronically controlled switch.\nIt can conduct in both directions, allowing analog voltages or currents to pass through.\nBecause the switch is bidirectional, an analog multiplexer can also operate as an analog\ndemultiplexer simply by exchanging its inputs and outputs."}, {"number": 7, "question": "What is a demultiplexer?", "answer": "A demultiplexer performs the opposite operation of a multiplexer.\nInstead of selecting one input from many, it distributes one input signal to one of many\noutputs.\nThe output channel is selected by a binary address.\nOnly the selected output receives the input signal.\nAll remaining outputs remain at logic 0.\nThus:\n• Multiplexer → many inputs, one output.\n• Demultiplexer → one input, many outputs."}, {"number": 8, "question": "How can a decoder be obtained from a demultiplexer?", "answer": "A decoder is simply a special case of a demultiplexer.\nIf the data input of the demultiplexer is permanently connected to logic 1, the selected\noutput becomes 1 while every other output remains 0.\nTherefore, a demultiplexer with its input tied to logic 1 behaves exactly like a decoder.\nThis illustrates the close relationship between these two circuits."}, {"number": 9, "question": "Why is a tree structure used for large multiplexers?", "answer": "Implementing a large multiplexer directly requires a decoder and hundreds of gated\ninverters.\nThis consumes many transistors.\nInstead, the multiplexer can be built as a binary tree of many 2-to-1 multiplexers.\nEach stage selects between pairs of signals.\nThe outputs of one stage become the inputs of the next stage until only one signal remains.\nThis greatly reduces transistor count while preserving the same functionality."}, {"number": 10, "question": "What are the advantages and disadvantages of a tree-structured multiplexer?", "answer": "The main advantage is reduced hardware complexity.\nFor a 256-to-1 multiplexer:\n• Decoder implementation: approximately 6100 transistors\n• Tree implementation: approximately 2040 transistors\nThus, the tree structure uses roughly three times fewer transistors.\nThe disadvantage is speed.\nThe signal must pass through several stages of multiplexers, increasing propagation delay.\nTherefore, the tree structure trades speed for reduced silicon area."}, {"number": 11, "question": "How is a demultiplexer implemented as a tree?", "answer": "A large demultiplexer can also be constructed hierarchically.\nInstead of using many AND gates, it consists of multiple 1-to-2 demultiplexers connected\nin stages.\nEach stage routes the signal toward the correct branch.\nFor a 256-output demultiplexer, the lecture estimates approximately 3076 transistors,\nmaking this implementation significantly smaller than the direct realization."}, {"number": 12, "question": "What is an FPGA lookup table (LUT)?", "answer": "A lookup table (LUT) is one of the fundamental building blocks of an FPGA.\nInstead of implementing logic using fixed gates, the truth table of the desired Boolean\nfunction is stored in memory cells.\nA multiplexer then selects the correct memory bit according to the current input values.\nThus, the FPGA realizes arbitrary combinational logic simply by programming memory\ncontents.\nTo reduce area, the lecture explains that LUT multiplexers are often implemented using\nonly NMOS transistors, with a PMOS pull-up transistor restoring a full logic 1 level."}, {"number": 13, "question": "What is an encoder?", "answer": "An encoder performs the opposite operation of a decoder.\nInstead of converting a binary number into one active output, it converts one active input\ninto its binary code.\nFor example, in a keyboard:\n\n• every key corresponds to one input,\n• the encoder outputs the binary number representing the pressed key.\nThe simplest encoder assumes that only one input is active at any time.\nIts outputs are usually implemented using OR gates."}, {"number": 14, "question": "Why is a priority encoder needed?", "answer": "A simple encoder works correctly only when exactly one input is active.\nIf two keys are pressed simultaneously, the OR-gate implementation produces an incorrect\nbinary code.\nA priority encoder solves this problem.\nWhen several inputs are active, it outputs only the binary code of the input with the highest\npriority.\nThis is achieved by adding a priority network that suppresses all lower-priority inputs before\nthey reach the encoder."}, {"number": 15, "question": "Explain how a flash ADC uses an encoder.", "answer": "A flash Analog-to-Digital Converter (ADC) converts an analog input voltage into a binary\nnumber in a single step.\nIt consists of three main parts:\n• a resistor ladder generating reference voltages,\n• many comparators,\n• a priority encoder.\nEach comparator compares the input voltage with one reference voltage.\nAll comparators whose threshold is below the input voltage produce logic 1.\n\nThese comparator outputs form a thermometer code.\nThe priority encoder converts this thermometer code into the corresponding binary output.\nBecause all comparisons occur simultaneously, flash ADCs are extremely fast, although\nthey require a large number of comparators. For an n-bit flash ADC, 2ⁿ − 1 comparators\nare needed."}]}];
const KEY = 'dds_flashcards_progress_v1';
let view = {type:'home'};
let session = null;

function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function saveState(s) { localStorage.setItem(KEY, JSON.stringify(s)); }
function deckState(idx) {
  const s=loadState();
  if(!s[idx]) s[idx]={cursor:0, wrong:[]};
  if(!Array.isArray(s[idx].wrong)) s[idx].wrong=[];
  if(typeof s[idx].cursor!=='number') s[idx].cursor=0;
  return [s, s[idx]];
}
function esc(t) {
  return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function wrongSorted(ds) { return [...new Set(ds.wrong)].sort((a,b)=>a-b); }

function renderHome() {
  session=null;
  const state=loadState();
  document.getElementById('root').innerHTML = `
    <div class="hero">
      <h1>DDS Flashcards</h1>
      <p>232 cards. Lecture by lecture. Questions stay in the same order as the Q&amp;A.</p>
    </div>
    <div class="deck-list">
      ${DECKS.map((d,i)=>{
        const ds=state[i]||{cursor:0,wrong:[]};
        const wrong=Array.isArray(ds.wrong)?new Set(ds.wrong).size:0;
        const cursor=Math.min(Number(ds.cursor)||0,d.cards.length);
        return `<button class="deck" onclick="openLecture(${i})">
          <div class="deck-row"><div class="deck-title">${esc(d.title)}</div><div class="chev">›</div></div>
          <div class="meta"><span class="pill">${d.cards.length} cards</span><span class="pill">${wrong} wrong</span><span class="pill">${cursor}/${d.cards.length} reached</span></div>
        </button>`;
      }).join('')}
    </div>`;
}

function openLecture(i) {
  view={type:'lecture', deck:i};
  const d=DECKS[i];
  const [state,ds]=deckState(i);
  const wrong=wrongSorted(ds);
  const cursor=Math.min(ds.cursor,d.cards.length);
  const pct=d.cards.length?Math.round(cursor/d.cards.length*100):0;
  document.getElementById('root').innerHTML = `
    <div class="topbar"><button class="back" onclick="goHome()">‹</button><div class="top-title">Lecture</div></div>
    <div class="lecture-card">
      <h2>${esc(d.title)}</h2>
      <p>${d.cards.length} questions, kept in the exact Q&amp;A order.</p>
      <div class="progressline"><div style="width:${pct}%"></div></div>
      <div class="meta"><span>${cursor}/${d.cards.length} reached</span><span>${wrong.length} wrong</span></div>
      <div class="actions">
        <button class="btn primary" onclick="startNormal(${i})">${cursor>0 && cursor<d.cards.length ? 'Continue' : 'Start Flashcards'}</button>
        <button class="btn danger" onclick="startWrong(${i})" ${wrong.length?'':'disabled'}>Wrong Cards (${wrong.length})</button>
        <button class="btn" onclick="repeatFromStart(${i})">Repeat from Start</button>
      </div>
    </div>`;
}
function goHome() { view={type:'home'}; renderHome(); }

function startNormal(i) {
  const [state,ds]=deckState(i);
  let start=Math.min(ds.cursor, DECKS[i].cards.length);
  if(start>=DECKS[i].cards.length) start=0;
  session={deck:i, mode:'normal', indices:DECKS[i].cards.map((_,k)=>k), pos:start, revealed:false};
  renderCard();
}
function repeatFromStart(i) {
  const [state,ds]=deckState(i);
  ds.cursor=0; state[i]=ds; saveState(state);
  session={deck:i, mode:'normal', indices:DECKS[i].cards.map((_,k)=>k), pos:0, revealed:false};
  renderCard();
}
function startWrong(i) {
  const [state,ds]=deckState(i);
  const indices=wrongSorted(ds).filter(k=>k>=0 && k<DECKS[i].cards.length);
  if(!indices.length) return openLecture(i);
  session={deck:i, mode:'wrong', indices, pos:0, revealed:false};
  renderCard();
}

function renderCard() {
  if(!session) return renderHome();
  const d=DECKS[session.deck];
  if(session.pos>=session.indices.length) return renderDone();
  const idx=session.indices[session.pos];
  const c=d.cards[idx];
  const modeLabel=session.mode==='wrong'?'Wrong Cards':'Chronological';
  document.getElementById('root').innerHTML = `
    <div class="topbar"><button class="back" onclick="openLecture(${session.deck})">‹</button><div class="top-title">${esc(d.title)}</div></div>
    <div class="flash-wrap">
      <div class="flash-meta"><span>${modeLabel}</span><span>Question ${c.number} of ${d.cards.length}</span></div>
      <div class="flashcard">
        <div class="side-label">Question</div>
        <div class="question">${esc(c.question)}</div>
        <div id="answer" class="answer hidden"><div class="side-label">Answer</div>${esc(c.answer)}</div>
      </div>
      <div id="showWrap" class="footer-actions"><button class="btn primary" onclick="revealAnswer()">Show Answer</button></div>
      <div id="review" class="review-actions hidden">
        <button class="btn wrong" onclick="grade(false)">Wrong</button>
        <button class="btn correct" onclick="grade(true)">Correct</button>
      </div>
    </div>`;
}
function revealAnswer() {
  session.revealed=true;
  document.getElementById('answer').classList.remove('hidden');
  document.getElementById('showWrap').style.display='none';
  document.getElementById('review').classList.remove('hidden');
}
function grade(correct) {
  const i=session.deck;
  const idx=session.indices[session.pos];
  const [state,ds]=deckState(i);
  let wrong=new Set(ds.wrong);
  if(correct) wrong.delete(idx); else wrong.add(idx);
  ds.wrong=[...wrong].sort((a,b)=>a-b);
  if(session.mode==='normal') ds.cursor=Math.max(ds.cursor, idx+1);
  state[i]=ds; saveState(state);
  session.pos += 1;
  session.revealed=false;
  renderCard();
}
function renderDone() {
  const d=DECKS[session.deck];
  const [state,ds]=deckState(session.deck);
  const wrong=wrongSorted(ds).length;
  const wasMode=session.mode;
  document.getElementById('root').innerHTML = `
    <div class="topbar"><button class="back" onclick="openLecture(${session.deck})">‹</button><div class="top-title">${esc(d.title)}</div></div>
    <div class="lecture-card done">
      <h2>${wasMode==='wrong'?'Wrong-card review finished':'Lecture finished'}</h2>
      <p>${wrong} wrong card${wrong===1?'':'s'} currently saved.</p>
      <div class="actions">
        <button class="btn primary" onclick="repeatFromStart(${session.deck})">Repeat from Start</button>
        <button class="btn danger" onclick="startWrong(${session.deck})" ${wrong?'':'disabled'}>Wrong Cards (${wrong})</button>
        <button class="btn" onclick="openLecture(${session.deck})">Lecture Menu</button>
      </div>
    </div>`;
}

window.addEventListener('load', renderHome);
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
</script>
